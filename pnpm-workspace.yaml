# EVERY KEY IN THIS FILE MUST BE ONE pnpm RECOGNISES. Since pnpm 12 an unknown setting is no longer
# ignored in silence: because `packageManager` pins a version the running pnpm satisfies, pnpm rules
# out "meant for another pnpm" and fails the command with ERR_PNPM_UNRECOGNIZED_WORKSPACE_SETTINGS.
# A typo here therefore stops an install rather than quietly dropping the policy it was meant to set.
packages:
  - "packages/*"
  - "apps/*"
  - "config/*"

# Default catalog — pins shared versions across all packages (referenced as "catalog:")
catalog:
  react: ^19.2.8
  react-dom: ^19.2.8
  tailwindcss: ^4.3.3
  typescript: ^6.0.3

# LOCAL: let `shadcn add` (which runs `pnpm add @vegastack/x@^0.1.0`) resolve the
# unpublished @vegastack/* packages from the workspace instead of hitting npm.
# Post-publish these resolve from npm normally (workspace still preferred when version matches).
linkWorkspacePackages: true
preferWorkspacePackages: true

# `auto-install-peers=true` (.npmrc) makes pnpm resolve Next's OPTIONAL `@playwright/test` peer even
# though no manifest in this repo declares it. Left alone it pins itself to whatever it first
# resolved and drifts away from the `playwright` devDependency — and
# `tooling/verify-workflow-security.mjs` derives the Linux job container tag
# (`mcr.microsoft.com/playwright:v<version>-noble`) from the ONE `playwright` version the lockfile
# resolves, and fails closed when it finds two. This override keeps the phantom peer in lockstep, so
# the container tag has exactly one authority. Bump it together with `playwright` in
# package.json / packages/ui/package.json.
overrides:
  "@playwright/test": "1.63.0"

  # GHSA-rgj7-g3m4-5g8c (high) — sharp <0.35.4 bundles a libheif with GHSA-g89c-p67h-r497 and
  # GHSA-2jg2-4ch7-h545. Every other high advisory in this tree cleared by re-resolving the lockfile
  # inside the ranges its parents already declare; this one cannot, because miniflare (wrangler's
  # local Workers simulator, a devDependency of apps/docs) hard-pins `sharp: 0.35.2` with no range.
  # 0.35.4 is a patch of the same minor, and `next` already resolves it, so this scoped override
  # also collapses two copies of sharp's native binaries into one. Scoped rather than global so a
  # future `next` bump owns its own sharp range. Drop it once miniflare ships a version that does
  # not pin 0.35.2.
  "miniflare>sharp": "^0.35.4"

allowBuilds:
  esbuild: true
  msw: false
  sharp: true
  # workerd is wrangler's runtime (Cloudflare, trusted); its install script fetches the platform
  # binary the deploy workflow (`wrangler deploy`) needs. Enabled so CI install builds it cleanly.
  workerd: true

# Supply-chain floor (TD-5, decided 2026-09-07). A version must be 1440 minutes (24h) old before
# pnpm resolves it. 1440 is also pnpm 11's default (since v11.0.0), so this line does not change the
# floor — it changes what happens when a version is too new, and that is the whole point.
#
# `minimumReleaseAgeStrict` defaults to true when `minimumReleaseAge` is set explicitly and false
# when it is merely inherited (pnpm docs, Settings › dependency-resolution; enforced in
# config/reader/src/index.ts at tag v11.7.0). The two modes behave very differently, measured here
# on pnpm 11.7.0, 2026-09-07, resolving the then-too-new style-dictionary@5.5.3:
#
#   inherited/loose → pnpm APPENDS `minimumReleaseAgeExclude: [style-dictionary@5.5.3]` to this file
#     and installs the too-new version anyway ("Added 1 entry to minimumReleaseAgeExclude ..."). The
#     floor grants itself an exemption and the only trace is a line in a file nobody re-reads. The
#     two `fumadocs-*@16.10.5` excludes that used to live here were written by pnpm this way, not by
#     a human — which is why they were stale and why deleting them was safe.
#   explicit/strict → ERR_PNPM_NO_MATURE_MATCHING_VERSION, non-interactive, non-zero exit, nothing
#     written. On a TTY it prompts first; in CI it just fails.
#
# Fail closed, like every other gate in this repo. An install that would need a too-new package now
# stops and asks for a decision instead of quietly granting itself one.
#
# Scope. The floor covers transitive dependencies and exact pins, not just direct ranges. It is NOT
# limited to fresh resolutions: pnpm runs a post-resolution lockfile verifier ("Lockfile passes
# supply-chain policies") that re-checks already-locked versions in BOTH modes, so a lockfile
# carrying an immature version fails `--frozen-lockfile` in CI with
# ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION. That check already ran before this key was set; strict
# mode does not add it.
#
# Do NOT add `minimumReleaseAgeExclude` entries to get past a failure. Wait out the 24h, or take the
# previous patch and record the deferral. If pnpm ever writes one here on its own, that means this
# key was lost — restore it rather than keeping the version it let through.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
