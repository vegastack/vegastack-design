name: CI
on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Pinned Playwright image so Vitest browser mode + Playwright VRT share identical browsers/fonts.
    container: mcr.microsoft.com/playwright:v1.61.0-noble@sha256:57b65fdc9ceabe0ef613124c7bbe2babcf9362c4d85e382fe3b03604e84b428a
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # needed for `changeset status --since=origin/main`
          persist-credentials: false
      # The repository is mounted into the pinned container with host ownership. Trust only this
      # exact ephemeral workspace so git-backed gates (secret scan, drift checks, Changesets) work.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Self-contained on a clean checkout: design:verify builds the gitignored token dist before
      # checking generated design.md, the 538-item contracts, contrast, and dark/marketing parity.
      - run: pnpm design:verify
      # Workspace gates (Turborepo, package-scoped). Root-level `pnpm exec tsc/vitest` do NOT
      # resolve the per-package tsconfig path aliases / vitest configs and fail before validating
      # anything — always go through the package scripts.
      - run: pnpm typecheck # turbo run typecheck — per-package `tsc --noEmit`
      - run: pnpm lint # turbo run lint — design-lint (semantic-token + sanctioned-icon gate) + eslint
      # NOTE: Vitest browser mode finds the image's browsers via PLAYWRIGHT_BROWSERS_PATH, which
      # turbo.json must pass through (globalPassThroughEnv) — turbo's strict env otherwise strips
      # it and vitest dies at browserType.launch looking in $HOME/.cache.
      - run: pnpm test # turbo run test — Vitest browser mode + axe, incl. compiled-CSS color-contrast
      - run: pnpm --filter @vegastack/ui test:smoke # Firefox/WebKit for contract-marked motion/cross-engine risks
        # The pinned container executes as root, while Actions otherwise points HOME at a pwuser-owned
        # directory. Firefox refuses that ownership mismatch before any test can execute.
        env:
          HOME: /root
      - name: Build private-discovery matrix
        run: SITE_VISIBILITY=private pnpm build
      - name: Build public-discovery matrix
        run: SITE_VISIBILITY=public pnpm --filter @vegastack/docs build
      - run: pnpm registry:build
      # `registry:build` stamps THREE surfaces (registry JSON in apps/docs/public/r, the
      # registry SOURCE in packages/ui/registry/ui, and the docs copy-in in apps/docs/components/ui).
      # Check the FULL worktree — not just public/r — so an un-stamped copy-in, drifted source, or
      # any other registry-build side-effect fails CI (Codex R11: public/r-only was too narrow).
      - run: git status --porcelain && test -z "$(git status --porcelain)" # any stale/untracked file after registry:build fails CI
      # Prove the built registry is actually CONSUMABLE end-to-end (not just hash-green): registry
      # fetch + transitive registryDependencies + shipped-verifier integrity preflight + alias
      # rewrite + post-write verify + tsc of the consumed output. The final npm-install of the
      # unpublished @vegastack/* is publish-gated and resolved here via the workspace link.
      - run: pnpm registry:verify-consume
      - run: pnpm exec changeset status --since=origin/main
      # NOTE: Playwright visual-regression (VRT) runs as its OWN per-PR workflow (.github/workflows/
      # vrt.yml), in this same pinned image, so a slow screenshot job never blocks the fast typecheck/
      # lint/test gate here. It self-activates into a blocking pixel gate the moment baseline
      # screenshots are committed (a one-time `update_baselines` bootstrap, since deterministic PNGs
      # require the pinned Linux container). Color-contrast a11y is already enforced HERE via the
      # compiled-CSS Vitest browser run, independent of VRT.
