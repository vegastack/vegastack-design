name: CI

on:
  pull_request:

permissions:
  contents: read

env:
  SITE_VISIBILITY: public

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PR quality
    # Never execute fork-authored code on a persistent LAN runner.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, vsk-runner]
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      volumes:
        - /opt/vsk-runner/pnpm-store:/pnpm-store
        # Turbo and prettier caches persist across PR runs (PR-only; credentialed jobs never mount it).
        - /opt/vsk-runner/turbo-cache:/turbo-cache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Enable corepack
        run: |
          set -euo pipefail
          corepack enable
          node -v
          pnpm -v
      - run: pnpm install --frozen-lockfile --store-dir /pnpm-store
      - name: Static proof plus affected Chromium tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TURBO_CACHE_DIR: /turbo-cache/turbo
          PRETTIER_CACHE: /turbo-cache/prettier/.prettier-cache
          # Tooling tests related to the change only; the nightly full suite runs them all.
          VITEST_CHANGED: ${{ github.event.pull_request.base.sha }}
        run: pnpm verify:affected --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Lint workflows when they change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qE '^(\.github/|tooling/(verify-workflows|trusted-tool)\.mjs$|pnpm-lock\.yaml$)'; then
            node tooling/verify-workflows.mjs
          else
            node tooling/verify-workflows.mjs --policy
          fi
      - name: Require an applicable changeset
        run: pnpm exec changeset status --since=origin/main
      - name: Require generators to leave the checkout unchanged
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)" || {
            git status --short
            exit 1
          }
