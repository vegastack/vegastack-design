name: CI

on:
  pull_request:

permissions:
  contents: read

env:
  SITE_VISIBILITY: public

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PR quality
    # Never execute fork-authored code on a persistent LAN runner.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, vsk-runner]
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      volumes:
        - /opt/vsk-runner/pnpm-store:/pnpm-store
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Enable corepack
        run: |
          set -euo pipefail
          corepack enable
          node -v
          pnpm -v
      - run: pnpm install --frozen-lockfile --store-dir /pnpm-store
      - name: Static proof plus affected Chromium tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm verify:affected --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Require an applicable changeset
        run: pnpm exec changeset status --since=origin/main
      - name: Require generators to leave the checkout unchanged
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)" || {
            git status --short
            exit 1
          }
