name: CI
on:
  pull_request:

permissions:
  contents: read

# Self-hosted capacity is finite: a superseded push must not keep a mini busy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static gates, unit tests, builds, and registry integrity.
  #
  # GITHUB-HOSTED because it drives real browsers (Vitest browser mode + the cross-engine smoke).
  # The self-hosted mac minis cannot launch Chromium today: their Actions runner has no per-user Mach
  # bootstrap namespace, so every launch dies with
  # `bootstrap_look_up org.chromium.Chromium.MachPortRendezvousServer.1: Unknown service name (1102)`
  # and SIGTRAP. Reproduced deterministically on both minis across all retries in run 30131471680,
  # while the identical suite passes locally on the same OS and CPU. The fix is on the host — reinstall
  # the runner as a LaunchAgent in a logged-in session instead of a LaunchDaemon — after which this
  # job and the four other browser lanes can move back by editing GITHUB_HOSTED_JOBS.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # needed for `changeset status --since=origin/main`
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # No pinned container supplies browsers any more, and `ubuntu-latest` is not a Playwright
      # image, so `--with-deps` is required for the shared libraries Chromium/Firefox/WebKit need.
      - run: pnpm --filter @vegastack/ui exec playwright install --with-deps chromium firefox webkit
      # Self-contained on a clean checkout: design:verify builds the gitignored token dist before
      # checking generated design.md, the 538-item contracts, contrast, and dark/marketing parity.
      - run: pnpm design:verify
      # Workspace gates (Turborepo, package-scoped). Root-level `pnpm exec tsc/vitest` do NOT
      # resolve the per-package tsconfig path aliases / vitest configs and fail before validating
      # anything — always go through the package scripts.
      - run: pnpm typecheck # turbo run typecheck — per-package `tsc --noEmit`
      - run: pnpm lint # turbo run lint — design-lint (semantic-token + sanctioned-icon gate) + eslint
      - run: pnpm test # turbo run test — Vitest browser mode + axe, incl. compiled-CSS color-contrast
      - run: pnpm --filter @vegastack/ui test:smoke # Firefox/WebKit for contract-marked motion/cross-engine risks
      - name: Build private-discovery matrix
        run: SITE_VISIBILITY=private pnpm build
      - name: Build public-discovery matrix
        run: SITE_VISIBILITY=public pnpm --filter @vegastack/docs build
      - run: pnpm registry:build
      # `registry:build` stamps THREE surfaces (registry JSON in apps/docs/public/r, the
      # registry SOURCE in packages/ui/registry/ui, and the docs copy-in in apps/docs/components/ui).
      # Check the FULL worktree — not just public/r — so an un-stamped copy-in, drifted source, or
      # any other registry-build side-effect fails CI (Codex R11: public/r-only was too narrow).
      - run: git status --porcelain && test -z "$(git status --porcelain)" # any stale/untracked file after registry:build fails CI
      # Prove the built registry is actually CONSUMABLE end-to-end (not just hash-green): registry
      # fetch + transitive registryDependencies + shipped-verifier integrity preflight + alias
      # rewrite + post-write verify + tsc of the consumed output. The final npm-install of the
      # unpublished @vegastack/* is publish-gated and resolved here via the workspace link.
      - run: pnpm registry:verify-consume
      - run: pnpm exec changeset status --since=origin/main

  # The blocking visual-surface gate: 768 behaviour contracts over every component route — 320px
  # reflow, RTL containment, forced-colors focus visibility, and effective 24px pointer targets.
  # It takes NO screenshots and needs no baselines, so it runs anywhere and can never be cleared by
  # regenerating its own evidence. Pixel review is a local `/ship` step (tooling/vrt-review.mjs).
  # Separate job so a slow browser lane never blocks the fast gate above.
  # GITHUB-HOSTED for the same reason as `verify` above — see that comment.
  contracts:
    runs-on: ubuntu-latest
    env:
      SITE_VISIBILITY: public
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vegastack/docs exec playwright install --with-deps chromium
      # Build the docs' workspace dependencies; Playwright's webServer runs the docs build itself.
      - run: pnpm exec turbo run build --filter=@vegastack/docs^...
      # These runners are PERSISTENT. `reuseExistingServer: false` makes Playwright throw when the
      # port is taken, and a cancelled job (concurrency above cancels superseded runs) kills
      # Playwright without running webServer teardown — orphaning `serve` on the port. A fixed port
      # would brick every later run on that mini until someone SSHed in. Bind a free one instead,
      # and reap it unconditionally below.
      - name: Reserve a free capture port
        run: |
          set -euo pipefail
          PORT=$(node -e 'const s=require("net").createServer();s.listen(0,"127.0.0.1",()=>{process.stdout.write(String(s.address().port));s.close()})')
          echo "VRT_PORT=$PORT" >> "$GITHUB_ENV"
          echo "Capture server will bind 127.0.0.1:$PORT"
      - run: pnpm --filter @vegastack/docs test:contracts
      - name: Reap the capture server
        if: ${{ always() }}
        run: |
          PIDS=$(lsof -ti "tcp:${VRT_PORT:-0}" 2>/dev/null || true)
          if [ -n "$PIDS" ]; then echo "killing leftover server: $PIDS"; kill -9 $PIDS || true; fi
      # Without this a red gate is a bare exit code: no trace, no error context, and the only way to
      # see what broke is another full run. That is what trapped an earlier release for two days.
      - name: Upload the failing run's report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contracts-failure-${{ github.run_id }}
          path: |
            apps/docs/playwright-report
            apps/docs/test-results
          if-no-files-found: ignore
          retention-days: 7
