name: CI
on:
  pull_request:

permissions:
  contents: read

# Self-hosted capacity is finite: a superseded push must not keep a mini busy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# THIS WORKFLOW COSTS NOTHING. Every job runs on the self-hosted mac minis, because after the
# local-first migration nothing here drives a browser: the Vitest browser suite, the cross-engine
# smoke, and the 864 behaviour contracts all run in `.husky/pre-push` on a developer machine and are
# attested by `.gates/receipt.json`, which `receipt-guard` below verifies against the pushed tree.
#
# Before the migration this workflow was ~110 billable minutes per push (a ~10-17min `verify` plus
# four ~25min contract shards, re-paid on every push because `cancel-in-progress` restarts it).
# The mini already proved it can run everything that remains: in job 89606685733,
# `pnpm design:verify`, `pnpm typecheck`, and `pnpm lint` all passed there and only `pnpm test`
# failed, on the Mach-bootstrap browser-launch bug recorded in AGENTS.md § Locked decisions.
#
# The runner allowlist in tooling/verify-workflow-security.mjs enforces this — `ci.yml` maps to an
# EMPTY set of GitHub-hosted jobs, so adding one fails that gate rather than quietly costing money.
jobs:
  # Everything that executes repository code and needs no browser. Independently re-executed here
  # rather than trusted from the receipt — that split is the whole reliability argument, and it is
  # written out in AGENTS.md § Verification ladder.
  verify:
    needs: receipt-guard
    runs-on: [self-hosted, vsk-runners-mac-mini]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # needed for `changeset status --since=origin/main`
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - name: Start dependency setup measurement
        run: date +%s > "$RUNNER_TEMP/dependency-setup-start-seconds"
      # Disabled unless BOTH repository variables opt in and pin one named mini. A missing variable
      # takes the cached control path, so this commit cannot silently start the one-week experiment.
      - name: "Setup Node (cache canary: no Actions cache)"
        if: vars.SELF_HOSTED_PNPM_CACHE_CANARY == 'enabled' && runner.name == vars.SELF_HOSTED_PNPM_CACHE_CANARY_RUNNER
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24 }
      - name: "Setup Node (cached control/default)"
        if: vars.SELF_HOSTED_PNPM_CACHE_CANARY != 'enabled' || runner.name != vars.SELF_HOSTED_PNPM_CACHE_CANARY_RUNNER
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm }
      - name: Mark dependency setup/cache completion
        if: always()
        run: date +%s > "$RUNNER_TEMP/dependency-setup-end-seconds"
      - name: Frozen dependency install
        id: frozen-install
        run: pnpm install --frozen-lockfile
      - name: Retain dependency setup/install cohort measurement
        if: always()
        env:
          DEPENDENCY_CACHE_COHORT: ${{ vars.SELF_HOSTED_PNPM_CACHE_CANARY == 'enabled' && runner.name == vars.SELF_HOSTED_PNPM_CACHE_CANARY_RUNNER && 'canary-runner-local-store' || 'control-actions-pnpm-cache' }}
          DEPENDENCY_INSTALL_OUTCOME: ${{ steps.frozen-install.outcome }}
          DEPENDENCY_RUNNER_ID: ${{ runner.name }}
        run: |
          set -euo pipefail
          date +%s > "$RUNNER_TEMP/dependency-install-end-seconds"
          PNPM_STORE_BYTES=""
          if STORE_PATH=$(pnpm store path --silent 2>/dev/null) && [ -d "$STORE_PATH" ]; then
            PNPM_STORE_BYTES=$(du -sk "$STORE_PATH" | awk '{print $1 * 1024}')
          fi
          export PNPM_STORE_BYTES
          node tooling/report-workflow-setup.mjs
      # Workspace gates (Turborepo, package-scoped). Root-level `pnpm exec tsc/vitest` do NOT
      # resolve the per-package tsconfig path aliases / vitest configs and fail before validating
      # anything — always go through the package scripts.
      - run: pnpm typecheck # turbo run typecheck — per-package `tsc --noEmit`
      # `pnpm lint` includes verify-hooks-installed.mjs, so a tree whose hooks are missing, emptied,
      # or unwired fails HERE. That matters more than it looks: those hooks are the only place the
      # browser lanes run, and husky's dispatcher exits 0 silently when a committed hook is absent.
      # It also executes design:verify exactly once, including the 554-item reconciliation and every
      # classifier, receipt, workflow, operator-doc, and generated-surface negative fixture.
      - name: Lint and design verification (single invocation)
        run: pnpm lint
      # `@vegastack/design`'s tests are three plain `node test/*.mjs` files and run here.
      # `@vegastack/ui`'s are Vitest browser mode and run in the pre-push hook — hence the filter
      # rather than a bare `pnpm test`.
      - run: pnpm exec turbo run test --filter=@vegastack/design
      - name: Build private-discovery matrix
        run: SITE_VISIBILITY=private pnpm build
      - name: Build public-discovery matrix
        run: SITE_VISIBILITY=public pnpm --filter @vegastack/docs build
      - run: pnpm registry:build
      # `registry:build` stamps THREE surfaces (registry JSON in apps/docs/public/r, the registry
      # SOURCE in packages/ui/registry/ui, and the docs copy-in in apps/docs/components/ui). Check
      # the FULL worktree — not just public/r — so an un-stamped copy-in, drifted source, or any
      # other registry-build side-effect fails CI (Codex R11: public/r-only was too narrow).
      - name: Require registry build idempotency
        run: |
          set -euo pipefail
          git status --porcelain > "$RUNNER_TEMP/git-status"
          if [ -s "$RUNNER_TEMP/git-status" ]; then
            echo "::error title=Generated registry drift::registry:build changed the checked-out commit."
            cat "$RUNNER_TEMP/git-status"
            exit 1
          fi
      # Prove the built registry is actually CONSUMABLE end-to-end (not just hash-green): registry
      # fetch + transitive registryDependencies + shipped-verifier integrity preflight + alias
      # rewrite + post-write verify + tsc of the consumed output. Real and simulated representative
      # roots are fresh-consumer isolated; the complete two-layout consolidated oracle still proves
      # collision ownership and whole-layout tsc. Entirely offline — every server it needs is a
      # 127.0.0.1 sidecar. D1 remains open, so affected reports do not skip this full execution.
      - name: Full isolated and consolidated registry consume proof
        run: pnpm registry:verify-consume
      - run: pnpm exec changeset status --since=origin/main

  # The browser half. Nothing here executes a browser — it verifies that something did, on a
  # developer machine, against exactly this content.
  #
  # A receipt is ATTESTATION, NOT PROOF: `--no-verify` (or `HUSKY=0`) plus a hand-edited JSON defeats
  # it. What it buys is that skipping a browser gate becomes visible and auditable instead of silent.
  # tooling/lib/gate-receipt.mjs states this in full; do not let it be read as more than it is.
  receipt-guard:
    runs-on: [self-hosted, vsk-runners-mac-mini]
    steps:
      # Check out the BRANCH TIP, not the PR merge commit. The receipt is bound to the tree the
      # developer actually tested and pushed; the merge commit's tree also contains whatever landed
      # on main since, which the developer never ran the gates against. Verifying the merge result
      # would therefore always fail for a stale branch, for a reason that is not a defect.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24 }
      # No `pnpm install`: the guard and the classifier are dependency-free Node scripts reading git
      # and committed JSON. Keeping it that way makes this job seconds rather than minutes, and means
      # a broken lockfile cannot mask a missing receipt.
      - name: Verify the gate receipt covers this tree
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node tooling/classify-change.mjs --before "$BASE_SHA" --after "$HEAD_SHA"
          node tooling/verify-gate-receipt.mjs --before "$BASE_SHA" --after "$HEAD_SHA"
