name: Deploy (docs + signed registry)
# Manual by design: every outward deploy still requires a fresh MK decision.
on:
  workflow_dispatch:
    inputs:
      cutover_phase:
        description: >-
          ordinary for routine deploys; prepare to verify root SSO and purge retired artifacts;
          verify only after root SSO has been removed.
        type: choice
        options:
          - ordinary
          - prepare
          - verify
        default: ordinary

permissions:
  contents: read

env:
  SITE_VISIBILITY: public

# Serialize the complete build/sign/deploy/cutover chain so an older run cannot deploy after or
# attest a newer run. The manual dispatch from main is the explicit outward-deploy approval.
concurrency:
  group: production-docs
  cancel-in-progress: false

# RUNNER SPLIT. Jobs that execute repository code run on the self-hosted mac minis. Three classes
# deliberately stay on GitHub-hosted runners:
#
#   sign-curated       the only OIDC job. Sigstore has no documented self-hosted restriction, but
#                      that is unverified and a failure breaks the release. ~30s, no repository code.
#   deploy-curated     credential-only. Third-party wrangler + cosign actions, ~1min, no repository
#                      code. Nothing is gained by moving it and an outward deploy is what breaks.
#   the boundary jobs  CORRECTNESS, not caution. pre-cutover-purge, verify-protected-boundary, and
#                      verify-public-boundary assert that ANONYMOUS requests are rejected. A runner
#                      inside VegaStack's network can be silently authenticated by Cloudflare device
#                      posture, which would make "anonymous" mean something else and void the proof.
#                      A boundary test has to originate outside the trusted network.

jobs:
  ref-guard:
    runs-on: [self-hosted, vsk-runners-mac-mini]
    steps:
      - name: Require the protected production ref
        env:
          DISPATCH_REF: ${{ github.ref }}
          CUTOVER_PHASE: ${{ inputs.cutover_phase }}
          CUTOVER_STATE: ${{ vars.PUBLIC_DOCS_CUTOVER }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = "refs/heads/main" || {
            echo "::error title=Untrusted deployment ref::Production deploys must be dispatched from refs/heads/main, not $DISPATCH_REF."
            exit 1
          }
          if [ "$CUTOVER_PHASE" = "prepare" ] && [ "$CUTOVER_STATE" = "complete" ]; then
            echo "::error title=Cutover already complete::The one-time prepare phase is permanently retired. Use cutover_phase=ordinary."
            exit 1
          fi

  # Release-blocking visual-surface gate. This deliberately does NOT trust the pull-request run:
  # `main` carries no branch protection, `ci.yml` only fires on `pull_request`, and `release.yml`'s
  # gate is conditional on a visual-surface change — so a direct push to `main` can reach a deploy
  # having never executed a single contract assertion. This is the last place to catch that, and it
  # is the only workflow that ships to production. ~6 minutes, no screenshots, no baselines.
  # GITHUB-HOSTED: drives Chromium, which the mac minis cannot launch — see ci.yml's `verify`.
  contracts-gate:
    needs: ref-guard
    runs-on: ubuntu-latest
    # Sharded for wall clock — the lane is CPU-bound; see apps/docs/playwright.config.ts.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vegastack/docs exec playwright install --with-deps chromium
      - run: pnpm exec turbo run build --filter=@vegastack/docs^...
      - name: Reserve a free capture port
        run: |
          set -euo pipefail
          PORT=$(node -e 'const s=require("net").createServer();s.listen(0,"127.0.0.1",()=>{process.stdout.write(String(s.address().port));s.close()})')
          echo "VRT_PORT=$PORT" >> "$GITHUB_ENV"
      - name: Component contract gate
        working-directory: apps/docs
        env:
          SHARD: ${{ matrix.shard }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: contracts-report.json
        run: pnpm exec playwright test contracts.spec.ts --shard="$SHARD/4"
      - name: Guard — fail if zero contract tests executed
        working-directory: apps/docs
        run: |
          node -e '
            const r = require("./contracts-report.json");
            const ran = (r.stats?.expected||0)+(r.stats?.unexpected||0)+(r.stats?.flaky||0);
            if (ran === 0) { console.error("✗ Contract gate executed 0 tests — not valid passing evidence for a deploy."); process.exit(1); }
            console.log(`✓ Contract gate executed ${ran} test(s).`);
          '
      - name: Upload the failing run's report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contracts-failure-${{ github.run_id }}-shard${{ matrix.shard }}
          path: |
            apps/docs/playwright-report
            apps/docs/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Reap the capture server
        if: ${{ always() }}
        run: |
          PIDS=$(lsof -ti "tcp:${VRT_PORT:-0}" 2>/dev/null || true)
          if [ -n "$PIDS" ]; then echo "killing leftover server: $PIDS"; kill -9 $PIDS || true; fi

  # Build and validate repository-controlled code without OIDC or Cloudflare credentials.
  build-curated:
    needs: contracts-gate
    runs-on: [self-hosted, vsk-runners-mac-mini]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm registry:build
      - name: Require registry build idempotency
        run: |
          set -euo pipefail
          git status --porcelain > "$RUNNER_TEMP/git-status"
          if [ -s "$RUNNER_TEMP/git-status" ]; then
            echo "::error title=Generated registry drift::registry:build changed the checked-out deploy commit."
            cat "$RUNNER_TEMP/git-status"
            exit 1
          fi
      - run: node tooling/verify-registry-integrity-negative.mjs
      - run: pnpm build
      - name: Assert the unsigned artifact is complete
        run: |
          set -euo pipefail
          test -f apps/docs/out/r/integrity-manifest.json
          test ! -e apps/docs/out/r/integrity-manifest.sigstore
          BIG=$(find apps/docs/out -type f -size +24M | head -20)
          if [ -n "$BIG" ]; then
            echo "::error title=Asset over 25MiB::These exported files exceed Cloudflare's per-asset limit:"
            echo "$BIG" | while read -r file; do ls -lh "$file" | awk '{print "  "$5" "$9}'; done
            exit 1
          fi
      - name: Upload the validated unsigned artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-unsigned-${{ github.sha }}
          path: |
            apps/docs/out
            apps/docs/wrangler.jsonc
          if-no-files-found: error
          retention-days: 1

  # This is the only job allowed to mint GitHub OIDC. It executes no repository code.
  sign-curated:
    needs: build-curated
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: docs-unsigned-${{ github.sha }}
          path: apps/docs
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign and verify the exported integrity manifest
        env:
          SIGNER_REPOSITORY: ${{ github.repository }}
          SIGNER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          MANIFEST=apps/docs/out/r/integrity-manifest.json
          BUNDLE=apps/docs/out/r/integrity-manifest.sigstore
          IDENTITY="https://github.com/${SIGNER_REPOSITORY}/.github/workflows/deploy.yml@${SIGNER_REF}"
          cosign sign-blob --yes --bundle "$BUNDLE" "$MANIFEST"
          COMMON=(
            --bundle "$BUNDLE"
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
            --certificate-github-workflow-repository "$SIGNER_REPOSITORY"
            --certificate-github-workflow-ref "$SIGNER_REF"
          )
          cosign verify-blob "${COMMON[@]}" --certificate-identity "$IDENTITY" "$MANIFEST"

          cp "$MANIFEST" "$RUNNER_TEMP/tampered-manifest.json"
          printf '\n' >> "$RUNNER_TEMP/tampered-manifest.json"
          if cosign verify-blob "${COMMON[@]}" --certificate-identity "$IDENTITY" "$RUNNER_TEMP/tampered-manifest.json"; then
            echo "::error::Tampered manifest unexpectedly verified"
            exit 1
          fi
          WRONG_IDENTITY="https://github.com/${SIGNER_REPOSITORY}/.github/workflows/release.yml@${SIGNER_REF}"
          if cosign verify-blob "${COMMON[@]}" --certificate-identity "$WRONG_IDENTITY" "$MANIFEST"; then
            echo "::error::Wrong signer identity unexpectedly verified"
            exit 1
          fi
      - name: Upload the immutable signed artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-signed-${{ github.sha }}
          path: |
            apps/docs/out
            apps/docs/wrangler.jsonc
          if-no-files-found: error
          retention-days: 1

  # The credential-only deploy job reverifies the signed artifact and uses the existing repository
  # Cloudflare secrets. It cannot mint OIDC and executes no repository-controlled package scripts.
  deploy-curated:
    needs: sign-curated
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: docs-signed-${{ github.sha }}
          path: apps/docs
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Reverify the exact artifact immediately before deployment
        env:
          SIGNER_REPOSITORY: ${{ github.repository }}
          SIGNER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle apps/docs/out/r/integrity-manifest.sigstore \
            --certificate-identity "https://github.com/${SIGNER_REPOSITORY}/.github/workflows/deploy.yml@${SIGNER_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$SIGNER_REPOSITORY" \
            --certificate-github-workflow-ref "$SIGNER_REF" \
            apps/docs/out/r/integrity-manifest.json
      - name: Deploy to Cloudflare Workers Static Assets
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: apps/docs
          wranglerVersion: 4.113.0
          command: deploy

  # Cutover phase 1 is its own explicit dispatch. While broad root SSO is still active, prove the
  # protected boundary and purge every retired derivative that could carry the old internal page.
  # The workflow then ENDS so the approved operator can remove root SSO out of band. A later `verify`
  # dispatch is the separate decision that tests the resulting public boundary.
  pre-cutover-purge:
    needs: deploy-curated
    if: inputs.cutover_phase == 'prepare' && vars.PUBLIC_DOCS_CUTOVER != 'complete'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24 }
      - name: Require recorded Access topology
        env:
          CF_ROOT_ACCESS_APPLICATION_ID: ${{ vars.CF_ROOT_ACCESS_APPLICATION_ID }}
          CF_INTERNAL_ACCESS_APPLICATION_ID: ${{ vars.CF_INTERNAL_ACCESS_APPLICATION_ID }}
          CF_REGISTRY_ACCESS_APPLICATION_ID: ${{ vars.CF_REGISTRY_ACCESS_APPLICATION_ID }}
          CF_ACCESS_SERVICE_TOKEN_EXPIRES_AT: ${{ vars.CF_ACCESS_SERVICE_TOKEN_EXPIRES_AT }}
        run: |
          set -euo pipefail
          test -n "${CF_ROOT_ACCESS_APPLICATION_ID:-}" || { echo "::error::Record CF_ROOT_ACCESS_APPLICATION_ID before cutover."; exit 1; }
          test -n "${CF_INTERNAL_ACCESS_APPLICATION_ID:-}" || { echo "::error::Record CF_INTERNAL_ACCESS_APPLICATION_ID before cutover."; exit 1; }
          test -n "${CF_REGISTRY_ACCESS_APPLICATION_ID:-}" || { echo "::error::Record CF_REGISTRY_ACCESS_APPLICATION_ID before cutover."; exit 1; }
          test -n "${CF_ACCESS_SERVICE_TOKEN_EXPIRES_AT:-}" || { echo "::error::Record CF_ACCESS_SERVICE_TOKEN_EXPIRES_AT before cutover."; exit 1; }
          node -e 'const expiry = Date.parse(process.env.CF_ACCESS_SERVICE_TOKEN_EXPIRES_AT); if (!Number.isFinite(expiry) || expiry <= Date.now()) throw new Error("Recorded service token expiry is invalid or elapsed")'
      - name: Purge retired public/internal artifacts and aggregate corpora
        env:
          DOCS_URL: ${{ vars.DOCS_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          node apps/docs/scripts/probe-precutover-protection.mjs
          node apps/docs/scripts/purge-retired-public-route.mjs

  # Before the one-time public cutover, ordinary deploys retain the proven production contract:
  # broad root SSO rejects anonymous docs traffic and `/r/*` accepts only the service token.
  verify-protected-boundary:
    needs: deploy-curated
    if: inputs.cutover_phase == 'ordinary' && vars.PUBLIC_DOCS_CUTOVER != 'complete'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24 }
      - name: Verify the protected docs and registry boundary (fail-closed)
        env:
          DOCS_URL: ${{ vars.DOCS_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node apps/docs/scripts/probe-precutover-protection.mjs

  # Live route-boundary verification: anonymous public HTML/Markdown/LLM/search/OG must be 200,
  # `/internal/*` must reject anonymous access, and `/r/*` must reject anonymous but accept the
  # service token (plus a cosign-verified manifest). It performs no Access mutation.
  #
  # Cutover phase 2 is a separate `verify` dispatch after the operator removes root SSO. Once the
  # cutover is recorded complete, the same public/internal/registry probe runs after every ordinary
  # deploy. It is deliberately independent of phase 1 so there is a real human pause between them.
  verify-public-boundary:
    needs: deploy-curated
    if: >-
      inputs.cutover_phase == 'verify'
      || (inputs.cutover_phase == 'ordinary' && vars.PUBLIC_DOCS_CUTOVER == 'complete')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24 }
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Verify the public/internal/registry boundary (fail-closed)
        env:
          DOCS_URL: ${{ vars.DOCS_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SIGNER_REPOSITORY: ${{ github.repository }}
          SIGNER_REF: refs/heads/main
        run: node apps/docs/scripts/probe-deployment.mjs
