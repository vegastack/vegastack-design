name: Deploy (docs + signed registry)
# Manual by design: every outward deploy still requires a fresh MK decision.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_VISIBILITY: public

# Serialize the complete build/sign/deploy/verify chain so an older run cannot deploy after or
# attest a newer run. The manual dispatch from main is the explicit outward-deploy approval.
concurrency:
  group: production-docs
  cancel-in-progress: false

# RUNNER TOPOLOGY. Every job runs on the self-hosted runners (`[self-hosted, vsk-runners-mac-mini]`) — no
# GitHub-hosted job, because an account-level billing lock suspended hosted runners. That lock also
# exhausts Actions artifact storage, so build → sign → deploy can no longer hand the built docs between
# jobs as artifacts; they are merged into one `build-sign-deploy` job (see its header for the tradeoff).
# Notes per job:
#
#   build-sign-deploy  builds the docs + registry, Sigstore-signs the integrity manifest (the only OIDC
#                      use; identity is the workflow ref, not the runner, so cosign verification is
#                      unchanged), and deploys to Cloudflare with the existing repository secrets.
#   verify-public-boundary  CORRECTNESS, not caution. It proves every non-registry route is public,
#                      `/internal/*` remains undiscoverable, and anonymous registry requests are
#                      rejected. Its proof needs an OUTSIDE-the-network origin, so the runner must NOT be
#                      enrolled in Cloudflare Access device posture / WARP — otherwise device posture
#                      could silently authenticate an "anonymous" request. Fail-safe if it were: such a
#                      request returns 200 and expectProtected() fails the deploy loudly.
#
# THE CONTRACT GATE THAT USED TO LIVE HERE IS GONE, AND WAS REPLACED RATHER THAN DROPPED.
# It ran the 864 behaviour contracts on four billed `ubuntu-latest` shards (~135 minutes per deploy)
# and existed because `main` carries no branch protection, `ci.yml` fires only on `pull_request`, and
# `release.yml`'s gate was conditional — so a direct push to `main` could reach a deploy having never
# executed a single contract assertion. That reasoning still holds, so `receipt-guard` below now
# closes the same hole for ~seconds: it demands a receipt covering the deployed tree with ALL THREE
# browser lanes present and passing, which only `pnpm gates:ship` (a full 108-route sweep) produces.
# A deploy therefore still cannot happen without a complete contract run — the run just happened on a
# developer machine, and the receipt is how this workflow knows it did.

jobs:
  ref-guard:
    runs-on: [self-hosted, vsk-runners-mac-mini]
    steps:
      - name: Require the protected production ref
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = "refs/heads/main" || {
            echo "::error title=Untrusted deployment ref::Production deploys must be dispatched from refs/heads/main, not $DISPATCH_REF."
            exit 1
          }

  # The browser half, attested rather than executed. Unlike ci.yml and release.yml this job requires
  # ALL THREE browser lanes unconditionally: a production deploy is the one step that must be preceded
  # by a complete local sweep, and only `pnpm gates:ship` — which runs the full 108-route contract
  # suite, the three-engine unit suite, and the cross-engine smoke — produces a receipt that satisfies
  # it. Conditional requirements would let a docs-only deploy through on a partial sweep, which is
  # exactly the hole the deleted hosted gate existed to close.
  #
  # A receipt is ATTESTATION, NOT PROOF (tooling/lib/gate-receipt.mjs). For an outward deploy that
  # residual trust is bounded by the fact that dispatching this workflow is itself an explicit MK
  # decision on a ref that ref-guard has already pinned to main.
  receipt-guard:
    needs: ref-guard
    runs-on: [self-hosted, vsk-runners-mac-mini]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24 }
      - name: Require a full-sweep gate receipt for the deployed tree
        run: |
          set -euo pipefail
          node tooling/verify-gate-receipt.mjs --contracts true --unit true --smoke true

  # Build, sign, and deploy in ONE job. These were three isolated jobs (build-curated → sign-curated →
  # deploy-curated) that passed the built docs between them as artifacts. Actions artifact storage is
  # unavailable under the billing lock (upload fails with a quota/ETIMEDOUT error), so the hand-off is
  # impossible — the steps run in a single job instead, in the same build → sign → reverify → deploy
  # order. TRADEOFF: repository build code now shares a job with the OIDC signing token and the
  # Cloudflare deploy credential, which the three-job split deliberately kept apart. It is bounded by
  # ref-guard (main only), receipt-guard (a full local sweep), and the fact that dispatching this
  # workflow is an explicit MK action. Restore the isolated split once artifact storage is available.
  # GitHub OIDC is minted by the Actions control plane and works on self-hosted runners; the Sigstore
  # signer identity is the workflow ref (deploy.yml@refs/heads/main), not the runner, so the certificate
  # identity probe-deployment.mjs pins is unchanged.
  build-sign-deploy:
    needs: receipt-guard
    runs-on: [self-hosted, vsk-runners-mac-mini]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm registry:build
      - name: Require registry build idempotency
        run: |
          set -euo pipefail
          git status --porcelain > "$RUNNER_TEMP/git-status"
          if [ -s "$RUNNER_TEMP/git-status" ]; then
            echo "::error title=Generated registry drift::registry:build changed the checked-out deploy commit."
            cat "$RUNNER_TEMP/git-status"
            exit 1
          fi
      - run: node tooling/verify-registry-integrity-negative.mjs
      - run: pnpm build
      - name: Assert the unsigned build is complete
        run: |
          set -euo pipefail
          test -f apps/docs/out/r/integrity-manifest.json
          test ! -e apps/docs/out/r/integrity-manifest.sigstore
          BIG=$(find apps/docs/out -type f -size +24M | head -20)
          if [ -n "$BIG" ]; then
            echo "::error title=Asset over 25MiB::These exported files exceed Cloudflare's per-asset limit:"
            echo "$BIG" | while read -r file; do ls -lh "$file" | awk '{print "  "$5" "$9}'; done
            exit 1
          fi
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign and verify the exported integrity manifest
        env:
          SIGNER_REPOSITORY: ${{ github.repository }}
          SIGNER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          MANIFEST=apps/docs/out/r/integrity-manifest.json
          BUNDLE=apps/docs/out/r/integrity-manifest.sigstore
          IDENTITY="https://github.com/${SIGNER_REPOSITORY}/.github/workflows/deploy.yml@${SIGNER_REF}"
          cosign sign-blob --yes --bundle "$BUNDLE" "$MANIFEST"
          COMMON=(
            --bundle "$BUNDLE"
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
            --certificate-github-workflow-repository "$SIGNER_REPOSITORY"
            --certificate-github-workflow-ref "$SIGNER_REF"
          )
          cosign verify-blob "${COMMON[@]}" --certificate-identity "$IDENTITY" "$MANIFEST"

          cp "$MANIFEST" "$RUNNER_TEMP/tampered-manifest.json"
          printf '\n' >> "$RUNNER_TEMP/tampered-manifest.json"
          if cosign verify-blob "${COMMON[@]}" --certificate-identity "$IDENTITY" "$RUNNER_TEMP/tampered-manifest.json"; then
            echo "::error::Tampered manifest unexpectedly verified"
            exit 1
          fi
          WRONG_IDENTITY="https://github.com/${SIGNER_REPOSITORY}/.github/workflows/release.yml@${SIGNER_REF}"
          if cosign verify-blob "${COMMON[@]}" --certificate-identity "$WRONG_IDENTITY" "$MANIFEST"; then
            echo "::error::Wrong signer identity unexpectedly verified"
            exit 1
          fi
      - name: Reverify the exact artifact immediately before deployment
        env:
          SIGNER_REPOSITORY: ${{ github.repository }}
          SIGNER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle apps/docs/out/r/integrity-manifest.sigstore \
            --certificate-identity "https://github.com/${SIGNER_REPOSITORY}/.github/workflows/deploy.yml@${SIGNER_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$SIGNER_REPOSITORY" \
            --certificate-github-workflow-ref "$SIGNER_REF" \
            apps/docs/out/r/integrity-manifest.json
      - name: Deploy to Cloudflare Workers Static Assets
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: apps/docs
          wranglerVersion: 4.113.0
          command: deploy

  # Live route-boundary verification: every non-registry HTML/Markdown/LLM/search/OG/internal route
  # must be anonymously reachable, internal operations pages must remain outside discovery and carry
  # noindex/no-store headers, and `/r/*` must reject anonymous requests while accepting the service
  # token. The signed manifest and the deployed tree's exact registry version are also verified.
  # Runs on the minis. The proof depends on the request originating OUTSIDE the trusted network: the
  # minis must NOT be enrolled in Cloudflare Access device posture / WARP. This is fail-safe if they
  # were — an authenticated "anonymous" /r/* request would return 200 and expectProtected() would fail
  # the deploy loudly (probe-deployment.mjs), rather than passing falsely.
  verify-public-boundary:
    needs: build-sign-deploy
    runs-on: [self-hosted, vsk-runners-mac-mini]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24 }
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Verify the public/internal/registry boundary (fail-closed)
        env:
          DOCS_URL: ${{ vars.DOCS_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SIGNER_REPOSITORY: ${{ github.repository }}
          SIGNER_REF: refs/heads/main
        run: node apps/docs/scripts/probe-deployment.mjs
