name: Deploy public docs and signed registry

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact release commit to deploy
        required: true
        type: string

permissions:
  contents: read

env:
  SITE_VISIBILITY: public

concurrency:
  group: production-docs
  cancel-in-progress: false

jobs:
  distribution-proof:
    name: Verify public distribution
    runs-on: [self-hosted, linux, vsk-runner]
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      volumes:
        - /opt/vsk-runner/pnpm-store:/pnpm-store
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_sha }}
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Require the exact public release commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch origin main
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/main || {
            echo "::error title=Untrusted deploy commit::$EXPECTED_SHA is not in main history"
            exit 1
          }
      - name: Enable corepack
        run: corepack enable
      - run: pnpm install --frozen-lockfile --store-dir /pnpm-store
      # Public export, registry integrity, real consume and focused docs-shell browser contracts.
      # No complete component suite runs in a deploy workflow.
      - run: pnpm verify:distribution

  build-sign-deploy:
    name: Build, sign, and deploy exact artifact
    needs: distribution-proof
    runs-on: [self-hosted, vsk-runners-mac-mini]
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_sha }}
      - name: Require the exact public release commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24 }
      - run: pnpm install --frozen-lockfile --store-dir "$RUNNER_WORKSPACE/pnpm-store"
      - run: pnpm registry:build
      - name: Require registry build idempotency
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)" || {
            git status --short
            exit 1
          }
      - run: node tooling/verify-registry-integrity-negative.mjs
      - run: pnpm build
      - name: Assert the unsigned public artifact is complete
        run: |
          set -euo pipefail
          test -f apps/docs/out/r/integrity-manifest.json
          test ! -e apps/docs/out/r/integrity-manifest.sigstore
          BIG=$(find apps/docs/out -type f -size +24M | head -20)
          if [ -n "$BIG" ]; then
            echo "::error title=Asset over 25MiB::$BIG"
            exit 1
          fi
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign and verify the exported integrity manifest
        env:
          SIGNER_REPOSITORY: ${{ github.repository }}
          SIGNER_REF: refs/heads/main
        run: |
          set -euo pipefail
          MANIFEST=apps/docs/out/r/integrity-manifest.json
          BUNDLE=apps/docs/out/r/integrity-manifest.sigstore
          IDENTITY="https://github.com/${SIGNER_REPOSITORY}/.github/workflows/deploy.yml@${SIGNER_REF}"
          cosign sign-blob --yes --bundle "$BUNDLE" "$MANIFEST"
          COMMON=(
            --bundle "$BUNDLE"
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
            --certificate-github-workflow-repository "$SIGNER_REPOSITORY"
            --certificate-github-workflow-ref "$SIGNER_REF"
          )
          cosign verify-blob "${COMMON[@]}" --certificate-identity "$IDENTITY" "$MANIFEST"
          cp "$MANIFEST" "$RUNNER_TEMP/tampered-manifest.json"
          printf '\n' >> "$RUNNER_TEMP/tampered-manifest.json"
          if cosign verify-blob "${COMMON[@]}" --certificate-identity "$IDENTITY" "$RUNNER_TEMP/tampered-manifest.json"; then
            echo "::error::Tampered manifest unexpectedly verified"
            exit 1
          fi
          WRONG="https://github.com/${SIGNER_REPOSITORY}/.github/workflows/release.yml@${SIGNER_REF}"
          if cosign verify-blob "${COMMON[@]}" --certificate-identity "$WRONG" "$MANIFEST"; then
            echo "::error::Wrong signer identity unexpectedly verified"
            exit 1
          fi
      - name: Reverify the exact artifact before deployment
        env:
          SIGNER_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle apps/docs/out/r/integrity-manifest.sigstore \
            --certificate-identity "https://github.com/${SIGNER_REPOSITORY}/.github/workflows/deploy.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$SIGNER_REPOSITORY" \
            --certificate-github-workflow-ref refs/heads/main \
            apps/docs/out/r/integrity-manifest.json
      - name: Deploy to Cloudflare Workers Static Assets
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: apps/docs
          wranglerVersion: 4.129.1
          command: deploy

  verify-public-boundary:
    name: Verify production boundary
    needs: build-sign-deploy
    runs-on: [self-hosted, vsk-runners-mac-mini]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24 }
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Verify public, internal, and protected registry routes
        env:
          DOCS_URL: ${{ vars.DOCS_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SIGNER_REPOSITORY: ${{ github.repository }}
          SIGNER_REF: refs/heads/main
        run: node apps/docs/scripts/probe-deployment.mjs
