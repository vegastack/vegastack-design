name: Deploy public docs and signed registry

# Two jobs (30-10-2026). `registry` ships /r/* first, on its own Worker (apps/docs/wrangler.registry.jsonc):
# registry:build, sign the integrity manifest, deploy, probe /r/*. Apps can pull about a minute after
# the release. `docs` then builds the static site once, deploys it and probes the whole boundary.
# Component regression and the real `shadcn add` consume proof belong to pull requests; this workflow
# proves only the artifacts it ships.

on:
  # Called by release.yml after every version; dispatch redeploys a given main commit by hand.
  workflow_call:
    inputs:
      expected_sha:
        description: Exact release commit to deploy
        required: true
        type: string
    secrets:
      CF_API_TOKEN:
        required: true
      CF_ACCOUNT_ID:
        required: true
      CF_ACCESS_CLIENT_ID:
        required: true
      CF_ACCESS_CLIENT_SECRET:
        required: true
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact release commit to deploy
        required: true
        type: string

permissions:
  contents: read

env:
  SITE_VISIBILITY: public
  # The LAN runners' link to npm drops connections under load (30-10-2026): fewer parallel
  # downloads, more and longer retries, so an install survives a bad minute instead of failing.
  # pnpm 11 reads only `pnpm_config_*` from the environment; `npm_config_*` is ignored.
  pnpm_config_network_concurrency: "8"
  pnpm_config_fetch_retries: "6"
  pnpm_config_fetch_retry_mintimeout: "10000"
  pnpm_config_fetch_retry_maxtimeout: "120000"
  pnpm_config_fetch_timeout: "300000"

jobs:
  registry:
    name: Registry — sign, deploy, probe
    concurrency:
      group: production-registry
      cancel-in-progress: false
    timeout-minutes: 15
    runs-on: [self-hosted, linux, vsk-runner]
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      volumes:
        # Trusted caches: mounted only by the release and deploy workflows, never by a job that runs
        # pull-request code, so nothing PR-authored can write into what a credentialed job installs.
        - /opt/vsk-runner/pnpm-store-trusted:/pnpm-store-trusted
        - /opt/vsk-runner/trusted-tools:/trusted-tools
    defaults:
      run:
        shell: bash
    env:
      npm_config_cache: /tmp/npm-cache
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_sha }}
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Require the exact public release commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch origin main
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/main || {
            echo "::error title=Untrusted deploy commit::$EXPECTED_SHA is not in main history"
            exit 1
          }
      - name: Install cosign (pinned, checksum-verified, cached)
        run: node tooling/trusted-tool.mjs cosign
      - name: Enable corepack
        run: corepack enable
      - run: tooling/runner/pnpm-install.sh --frozen-lockfile --store-dir /pnpm-store-trusted
      - run: pnpm registry:build
      - name: Require registry build idempotency
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)" || {
            git status --short
            exit 1
          }
      - name: Stage the registry assets
        run: node tooling/stage-registry.mjs
      - name: Sign and verify the integrity manifest
        env:
          SIGNER_REPOSITORY: ${{ github.repository }}
          SIGNER_REF: refs/heads/main
        run: |
          set -euo pipefail
          MANIFEST=apps/docs/dist-registry/r/integrity-manifest.json
          BUNDLE=apps/docs/dist-registry/r/integrity-manifest.sigstore
          test -f "$MANIFEST"
          test ! -e "$BUNDLE"
          cosign sign-blob --yes --bundle "$BUNDLE" "$MANIFEST"
          cosign verify-blob \
            --bundle "$BUNDLE" \
            --certificate-identity "https://github.com/${SIGNER_REPOSITORY}/.github/workflows/deploy.yml@${SIGNER_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$SIGNER_REPOSITORY" \
            --certificate-github-workflow-ref "$SIGNER_REF" \
            "$MANIFEST"
      - name: Deploy the registry Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: apps/docs
          wranglerVersion: 4.129.1
          command: deploy --config wrangler.registry.jsonc
      - name: Probe /r/* (service token accepted, anonymous rejected, signature valid)
        env:
          DOCS_URL: ${{ vars.DOCS_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SIGNER_REPOSITORY: ${{ github.repository }}
          SIGNER_REF: refs/heads/main
          PROBE_SCOPE: registry
        run: node apps/docs/scripts/probe-deployment.mjs

  docs:
    name: Docs — build, deploy, probe
    needs: registry
    concurrency:
      group: production-docs
      cancel-in-progress: false
    timeout-minutes: 25
    runs-on: [self-hosted, linux, vsk-runner]
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      volumes:
        # Trusted caches: mounted only by the release and deploy workflows, never by a job that runs
        # pull-request code, so nothing PR-authored can write into what a credentialed job installs.
        - /opt/vsk-runner/pnpm-store-trusted:/pnpm-store-trusted
        - /opt/vsk-runner/trusted-tools:/trusted-tools
        - /opt/vsk-runner/docs-cache-trusted:/docs-cache
    defaults:
      run:
        shell: bash
    env:
      npm_config_cache: /tmp/npm-cache
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_sha }}
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Require the exact public release commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch origin main
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/main || {
            echo "::error title=Untrusted deploy commit::$EXPECTED_SHA is not in main history"
            exit 1
          }
      - name: Install cosign (pinned, checksum-verified, cached)
        run: node tooling/trusted-tool.mjs cosign
      - name: Enable corepack
        run: corepack enable
      - run: pnpm install --frozen-lockfile --store-dir /pnpm-store-trusted
      - name: Reuse the docs build cache (Turbopack, twoslash types) across deploys
        run: mkdir -p apps/docs/.next && ln -sfn /docs-cache apps/docs/.next/cache
      # Workspace packages + docs static export, with the docs' metadata, export and emitted-CSS
      # contracts (they run inside the docs `build` script).
      - run: pnpm build
      - name: Public export links and docs-shell contracts
        run: |
          set -euo pipefail
          pnpm -F @vegastack/docs lint:links
          node tooling/verify-docs-shell.mjs
          node tooling/verify-docs-shell.mjs --self-test
      - name: Drop /r from the docs artifact (the registry Worker serves it) and bound asset size
        run: |
          set -euo pipefail
          rm -rf apps/docs/out/r
          BIG=$(find apps/docs/out -type f -size +24M | head -20)
          if [ -n "$BIG" ]; then
            echo "::error title=Asset over 25MiB::$BIG"
            exit 1
          fi
      - name: Deploy the docs Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: apps/docs
          wranglerVersion: 4.129.1
          command: deploy
      - name: Probe the whole public/private boundary
        env:
          DOCS_URL: ${{ vars.DOCS_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SIGNER_REPOSITORY: ${{ github.repository }}
          SIGNER_REF: refs/heads/main
        run: node apps/docs/scripts/probe-deployment.mjs
