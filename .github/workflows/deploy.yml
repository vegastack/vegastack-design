name: Deploy (docs + signed registry)
# Manual by design: every outward deploy still requires a fresh MK decision.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_VISIBILITY: public

# Serialize the complete build/sign/deploy/verify chain so an older run cannot deploy after or
# attest a newer run. The manual dispatch from main is the explicit outward-deploy approval.
concurrency:
  group: production-docs
  cancel-in-progress: false

# RUNNER SPLIT. Jobs that execute repository code run on the self-hosted mac minis. Three classes
# deliberately stay on GitHub-hosted runners:
#
#   sign-curated       the only OIDC job. Sigstore has no documented self-hosted restriction, but
#                      that is unverified and a failure breaks the release. ~30s, no repository code.
#   deploy-curated     credential-only. Third-party wrangler + cosign actions, ~1min, no repository
#                      code. Nothing is gained by moving it and an outward deploy is what breaks.
#   verify-public-boundary  CORRECTNESS, not caution. It proves every non-registry route is public,
#                      `/internal/*` remains undiscoverable, and anonymous registry requests are
#                      rejected. A runner inside VegaStack's network can be silently authenticated by
#                      Cloudflare device posture, which would make "anonymous" mean something else
#                      and void the proof. A boundary test has to originate outside the trusted
#                      network.
#
# THE CONTRACT GATE THAT USED TO LIVE HERE IS GONE, AND WAS REPLACED RATHER THAN DROPPED.
# It ran the 864 behaviour contracts on four billed `ubuntu-latest` shards (~135 minutes per deploy)
# and existed because `main` carries no branch protection, `ci.yml` fires only on `pull_request`, and
# `release.yml`'s gate was conditional — so a direct push to `main` could reach a deploy having never
# executed a single contract assertion. That reasoning still holds, so `receipt-guard` below now
# closes the same hole for ~seconds: it demands a receipt covering the deployed tree with ALL THREE
# browser lanes present and passing, which only `pnpm gates:ship` (a full 108-route sweep) produces.
# A deploy therefore still cannot happen without a complete contract run — the run just happened on a
# developer machine, and the receipt is how this workflow knows it did.

jobs:
  ref-guard:
    runs-on: [self-hosted, vsk-runners-mac-mini]
    steps:
      - name: Require the protected production ref
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = "refs/heads/main" || {
            echo "::error title=Untrusted deployment ref::Production deploys must be dispatched from refs/heads/main, not $DISPATCH_REF."
            exit 1
          }

  # The browser half, attested rather than executed. Unlike ci.yml and release.yml this job requires
  # ALL THREE browser lanes unconditionally: a production deploy is the one step that must be preceded
  # by a complete local sweep, and only `pnpm gates:ship` — which runs the full 108-route contract
  # suite, the three-engine unit suite, and the cross-engine smoke — produces a receipt that satisfies
  # it. Conditional requirements would let a docs-only deploy through on a partial sweep, which is
  # exactly the hole the deleted hosted gate existed to close.
  #
  # A receipt is ATTESTATION, NOT PROOF (tooling/lib/gate-receipt.mjs). For an outward deploy that
  # residual trust is bounded by the fact that dispatching this workflow is itself an explicit MK
  # decision on a ref that ref-guard has already pinned to main.
  receipt-guard:
    needs: ref-guard
    runs-on: [self-hosted, vsk-runners-mac-mini]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24 }
      - name: Require a full-sweep gate receipt for the deployed tree
        run: |
          set -euo pipefail
          node tooling/verify-gate-receipt.mjs --profile production-full \
            --contracts true --unit true --smoke true

  # Build and validate repository-controlled code without OIDC or Cloudflare credentials.
  build-curated:
    needs: receipt-guard
    runs-on: [self-hosted, vsk-runners-mac-mini]
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm }
      - id: candidate
        name: Discover one eligible exact-main Release candidate (shadow only)
        env:
          CANDIDATE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node tooling/deploy-candidate.mjs discover \
            --repository "$CANDIDATE_REPOSITORY" \
            --sha "$CANDIDATE_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - name: Download the selected immutable candidate by artifact ID
        if: steps.candidate.outputs.state == 'hit'
        env:
          CANDIDATE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate.outputs.artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.candidate.outputs.artifact_digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node tooling/deploy-candidate.mjs download \
            --repository "$CANDIDATE_REPOSITORY" \
            --artifact-id "$CANDIDATE_ARTIFACT_ID" \
            --expected-digest "$CANDIDATE_ARTIFACT_DIGEST" \
            --output "$RUNNER_TEMP/deploy-candidate.zip"
      - name: Extract the already hard-verified candidate archive by artifact ID
        if: steps.candidate.outputs.state == 'hit'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifact_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate.outputs.run_id }}
          path: ${{ runner.temp }}/deploy-candidate/apps/docs
      - run: pnpm install --frozen-lockfile
      - name: Verify candidate producer, exact tree, API/archive digest, manifest, and context
        if: steps.candidate.outputs.state == 'hit'
        env:
          CANDIDATE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
          CANDIDATE_RUN_ID: ${{ steps.candidate.outputs.run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ steps.candidate.outputs.run_attempt }}
        run: |
          set -euo pipefail
          node tooling/deploy-candidate.mjs verify \
            --root "$RUNNER_TEMP/deploy-candidate" \
            --context-root . \
            --manifest "$RUNNER_TEMP/deploy-candidate/apps/docs/deploy-candidate-manifest.json" \
            --repository "$CANDIDATE_REPOSITORY" \
            --run-id "$CANDIDATE_RUN_ID" \
            --run-attempt "$CANDIDATE_RUN_ATTEMPT" \
            --sha "$CANDIDATE_SHA"
      - run: pnpm registry:build
      - name: Require registry build idempotency
        run: |
          set -euo pipefail
          git status --porcelain > "$RUNNER_TEMP/git-status"
          if [ -s "$RUNNER_TEMP/git-status" ]; then
            echo "::error title=Generated registry drift::registry:build changed the checked-out deploy commit."
            cat "$RUNNER_TEMP/git-status"
            exit 1
          fi
      - run: node tooling/verify-registry-integrity-negative.mjs
      - run: pnpm build
      - name: Assert the unsigned artifact is complete
        run: |
          set -euo pipefail
          test -f apps/docs/out/r/integrity-manifest.json
          test ! -e apps/docs/out/r/integrity-manifest.sigstore
          BIG=$(find apps/docs/out -type f -size +24M | head -20)
          if [ -n "$BIG" ]; then
            echo "::error title=Asset over 25MiB::These exported files exceed Cloudflare's per-asset limit:"
            echo "$BIG" | while read -r file; do ls -lh "$file" | awk '{print "  "$5" "$9}'; done
            exit 1
          fi
      - name: Compare shadow candidate with the mandatory exact-tree rebuild
        if: steps.candidate.outputs.state == 'hit'
        env:
          CANDIDATE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
          CANDIDATE_RUN_ID: ${{ steps.candidate.outputs.run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ steps.candidate.outputs.run_attempt }}
        run: |
          set -euo pipefail
          node tooling/deploy-candidate.mjs create \
            --root . \
            --output "$RUNNER_TEMP/deploy-rebuilt-manifest.json" \
            --repository "$CANDIDATE_REPOSITORY" \
            --run-id "$CANDIDATE_RUN_ID" \
            --run-attempt "$CANDIDATE_RUN_ATTEMPT" \
            --sha "$CANDIDATE_SHA"
          node tooling/deploy-candidate.mjs compare \
            --candidate "$RUNNER_TEMP/deploy-candidate/apps/docs/deploy-candidate-manifest.json" \
            --rebuilt "$RUNNER_TEMP/deploy-rebuilt-manifest.json"
      - name: Summarize candidate observation and authoritative source
        if: always()
        env:
          CANDIDATE_STATE: ${{ steps.candidate.outputs.state }}
          CANDIDATE_REASON: ${{ steps.candidate.outputs.reason }}
          CANDIDATE_RUN_ID: ${{ steps.candidate.outputs.run_id }}
        run: |
          {
            echo "## Deploy candidate shadow observation"
            echo
            echo "- State: ${CANDIDATE_STATE:-unknown}"
            echo "- Reason: ${CANDIDATE_REASON:-unknown}"
            echo "- Producer run: ${CANDIDATE_RUN_ID:-not-applicable}"
            echo "- Reuse: disabled (D4 requires MK approval and a code change)"
            echo "- Production source: mandatory exact-tree build-curated rebuild"
            echo "- Cost accounting: producer and rebuild timings remain separate; a hit is unused candidate work in shadow."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the validated unsigned artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-unsigned-${{ github.sha }}
          path: |
            apps/docs/out
            apps/docs/wrangler.jsonc
          if-no-files-found: error
          retention-days: 1

  # This is the only job allowed to mint GitHub OIDC. It executes no repository code.
  sign-curated:
    needs: build-curated
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: docs-unsigned-${{ github.sha }}
          path: apps/docs
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign and verify the exported integrity manifest
        env:
          SIGNER_REPOSITORY: ${{ github.repository }}
          SIGNER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          MANIFEST=apps/docs/out/r/integrity-manifest.json
          BUNDLE=apps/docs/out/r/integrity-manifest.sigstore
          IDENTITY="https://github.com/${SIGNER_REPOSITORY}/.github/workflows/deploy.yml@${SIGNER_REF}"
          cosign sign-blob --yes --bundle "$BUNDLE" "$MANIFEST"
          COMMON=(
            --bundle "$BUNDLE"
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
            --certificate-github-workflow-repository "$SIGNER_REPOSITORY"
            --certificate-github-workflow-ref "$SIGNER_REF"
          )
          cosign verify-blob "${COMMON[@]}" --certificate-identity "$IDENTITY" "$MANIFEST"

          cp "$MANIFEST" "$RUNNER_TEMP/tampered-manifest.json"
          printf '\n' >> "$RUNNER_TEMP/tampered-manifest.json"
          if cosign verify-blob "${COMMON[@]}" --certificate-identity "$IDENTITY" "$RUNNER_TEMP/tampered-manifest.json"; then
            echo "::error::Tampered manifest unexpectedly verified"
            exit 1
          fi
          WRONG_IDENTITY="https://github.com/${SIGNER_REPOSITORY}/.github/workflows/release.yml@${SIGNER_REF}"
          if cosign verify-blob "${COMMON[@]}" --certificate-identity "$WRONG_IDENTITY" "$MANIFEST"; then
            echo "::error::Wrong signer identity unexpectedly verified"
            exit 1
          fi
      - name: Upload the immutable signed artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-signed-${{ github.sha }}
          path: |
            apps/docs/out
            apps/docs/wrangler.jsonc
          if-no-files-found: error
          retention-days: 1

  # The credential-only deploy job reverifies the signed artifact and uses the existing repository
  # Cloudflare secrets. It cannot mint OIDC and executes no repository-controlled package scripts.
  deploy-curated:
    name: Upload production candidate (completion pending live probes)
    needs: sign-curated
    runs-on: ubuntu-latest
    outputs:
      version_id: ${{ steps.capture-deployment.outputs.version_id }}
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: docs-signed-${{ github.sha }}
          path: apps/docs
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Reverify the exact artifact immediately before deployment
        env:
          SIGNER_REPOSITORY: ${{ github.repository }}
          SIGNER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle apps/docs/out/r/integrity-manifest.sigstore \
            --certificate-identity "https://github.com/${SIGNER_REPOSITORY}/.github/workflows/deploy.yml@${SIGNER_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$SIGNER_REPOSITORY" \
            --certificate-github-workflow-ref "$SIGNER_REF" \
            apps/docs/out/r/integrity-manifest.json
      - name: Upload production candidate to Cloudflare Workers Static Assets
        id: upload-candidate
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: apps/docs
          wranglerVersion: 4.113.0
          command: deploy
      # Console wording is not an API. Wrangler's official structured-output contract emits exactly
      # one successful `deploy` entry with the immutable Worker version ID and deployment targets.
      - name: Capture the structured Cloudflare version ID
        id: capture-deployment
        env:
          WRANGLER_OUTPUT_FILE: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const entries = readFileSync(process.env.WRANGLER_OUTPUT_FILE, 'utf8')
            .split('\n')
            .filter(Boolean)
            .map((line) => JSON.parse(line));
          const deployments = entries.filter((entry) => entry.type === 'deploy');
          if (deployments.length !== 1) {
            throw new Error(`expected exactly one structured deploy record, found ${deployments.length}`);
          }
          const [deployment] = deployments;
          if (typeof deployment.version_id !== 'string' || deployment.version_id.length === 0) {
            throw new Error('structured deploy record has no nonempty version_id');
          }
          if (!Array.isArray(deployment.targets) || deployment.targets.length === 0) {
            throw new Error('structured deploy record has no deployment target');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version_id=${deployment.version_id}\n`);
          NODE

  # Live route-boundary verification: every non-registry HTML/Markdown/LLM/search/OG/internal route
  # must be anonymously reachable, internal operations pages must remain outside discovery and carry
  # noindex/no-store headers, and `/r/*` must reject anonymous requests while accepting the service
  # token. The signed manifest and the deployed tree's exact registry version are also verified.
  verify-public-boundary:
    needs: deploy-curated
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24 }
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Verify the public/internal/registry boundary (fail-closed)
        env:
          DOCS_URL: ${{ vars.DOCS_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SIGNER_REPOSITORY: ${{ github.repository }}
          SIGNER_REF: refs/heads/main
        run: node apps/docs/scripts/probe-deployment.mjs

  # This is the only terminal success state. Uploading a live candidate is not completion: signing,
  # immediate artifact reverification, Cloudflare's structured version capture, and every anonymous/
  # internal/service-token production probe must all have succeeded before this job can start.
  deployment-complete:
    name: Deployment complete (all live probes passed)
    needs: [sign-curated, deploy-curated, verify-public-boundary]
    runs-on: [self-hosted, vsk-runners-mac-mini]
    steps:
      - name: Publish the terminal deployment summary
        env:
          DEPLOYED_SHA: ${{ github.sha }}
          VERSION_ID: ${{ needs.deploy-curated.outputs.version_id }}
        run: |
          set -euo pipefail
          test -n "$VERSION_ID"
          {
            echo "## Deployment complete"
            echo
            echo "- Commit: \`$DEPLOYED_SHA\`"
            echo "- Cloudflare version: \`$VERSION_ID\`"
            echo "- Executed: sign, immediate reverify, candidate upload, structured version capture, and live boundary probes"
            echo "- Result: production completion (not merely upload success)"
          } >> "$GITHUB_STEP_SUMMARY"
