name: Manual full component audit

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact commit SHA to audit
        required: true
        type: string
      engines:
        description: Browser coverage
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - all

permissions:
  contents: read

env:
  SITE_VISIBILITY: public

concurrency:
  group: full-component-audit-${{ inputs.commit_sha }}-${{ inputs.engines }}
  cancel-in-progress: false

jobs:
  full-component-suite:
    runs-on: [self-hosted, linux, vsk-runner]
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      volumes:
        - /opt/vsk-runner/pnpm-store:/pnpm-store
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}
      - name: Require the exact requested commit
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Enable corepack
        run: corepack enable
      - run: pnpm install --frozen-lockfile --store-dir /pnpm-store
      - name: Run the manual component audit
        env:
          AUDIT_ENGINES: ${{ inputs.engines }}
        run: pnpm test:full --engines "$AUDIT_ENGINES"
