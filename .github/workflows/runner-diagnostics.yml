name: Runner diagnostics (self-hosted mac mini)
# Manual, self-hosted only, and therefore FREE — no GitHub-hosted minutes are consumed.
#
# WHY THIS EXISTS
#   Two migrations onto the mac minis failed on assumptions instead of facts. This job establishes
#   the facts, in one run, before any workflow is re-pointed:
#
#     1. Does the runner's macOS user have a GUI (Aqua) login session? That, not the user account,
#        is what decides whether Chromium can start. A runner installed as a LaunchDaemon runs
#        outside any session and has no per-user Mach bootstrap namespace, so every Chromium launch
#        dies with `bootstrap_look_up … Unknown service name (1102)` and SIGTRAP.
#     2. Can Playwright actually launch Chromium, Firefox, and WebKit here?
#     3. How many cores? This decides shard-count vs worker-count: sharding across two machines only
#        queues, whereas more workers genuinely parallelises on an 8+ core mini.
#     4. Do the real suites pass, and how long do they take?
#
#   Every diagnostic probe is `continue-on-error` so one failure still yields the complete picture.
#   The structured-report reader and final verdict are strict and fail the job on any attempted
#   failure, missing evidence, or unknown state.
on:
  workflow_dispatch:
    inputs:
      deep:
        description: "Also run the real suites (contract checks + three-engine unit suite). Slower, still free."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, vsk-runners-mac-mini]
    env:
      DIAGNOSTIC_RUN_ID: runner-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Session and identity — the decisive check
        id: session
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          echo "runner user      : $(whoami)  (uid $(id -u))"
          echo "console owner    : $(stat -f%Su /dev/console 2>/dev/null || echo '?')   <- who is logged in at the GUI"
          MANAGER="$(launchctl managername 2>/dev/null || echo 'unknown')"
          echo "launchd manager  : $MANAGER   <- Aqua = GUI session, Background/System = no session"
          if launchctl print "gui/$(id -u)" >/dev/null 2>&1; then
            echo "gui domain       : PRESENT  <- per-user Mach bootstrap namespace exists"
            echo "gui_domain=yes" >> "$GITHUB_OUTPUT"
          else
            echo "gui domain       : MISSING  <- Chromium cannot hand Mach ports to child processes"
            echo "gui_domain=no" >> "$GITHUB_OUTPUT"
          fi
          echo "manager=$MANAGER" >> "$GITHUB_OUTPUT"
          echo
          echo "--- logged-in users ---"; who || true
          echo "--- is the runner a LaunchAgent or LaunchDaemon? ---"
          ls -1 "$HOME/Library/LaunchAgents"/*actions.runner* 2>/dev/null && echo "  ^ LaunchAgent (good)" || echo "  no LaunchAgent plist under \$HOME"
          ls -1 /Library/LaunchDaemons/*actions.runner* 2>/dev/null && echo "  ^ LaunchDaemon (this is the problem case)" || echo "  no LaunchDaemon plist"

      - name: Hardware and OS
        id: hw
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          CORES="$(sysctl -n hw.logicalcpu 2>/dev/null || echo 0)"
          echo "cores (logical)  : $CORES"
          echo "cores (physical) : $(sysctl -n hw.physicalcpu 2>/dev/null || echo '?')"
          echo "memory           : $(( $(sysctl -n hw.memsize 2>/dev/null || echo 0) / 1073741824 )) GiB"
          echo "arch             : $(uname -m)"
          echo "macOS            : $(sw_vers -productVersion 2>/dev/null || echo '?')"
          echo "cores=$CORES" >> "$GITHUB_OUTPUT"
          echo
          echo "--- leftover processes that could hold a port ---"
          pgrep -fl "serve out|next-server|chrome-headless|playwright" || echo "  (none)"

      - name: Toolchain
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          echo "node   : $(node --version 2>/dev/null || echo MISSING)"
          echo "pnpm   : $(pnpm --version 2>/dev/null || echo 'not on PATH yet (setup-node/pnpm add it per-job)')"
          echo "git    : $(git --version 2>/dev/null || echo MISSING)"
          echo "docker : $(docker --version 2>/dev/null || echo 'absent — irrelevant, Actions cannot use containers on macOS')"
          echo "sudo   : $(sudo -n true 2>/dev/null && echo 'passwordless available' || echo 'NOT available (fine — macOS needs no apt for Playwright)')"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm }
      - name: Install workspace
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      - name: Install browsers (native macOS builds — no container, no apt)
        continue-on-error: true
        run: pnpm --filter @vegastack/ui exec playwright install chromium firefox webkit

      - name: THE decisive test — can each engine actually launch?
        id: launch
        continue-on-error: true
        shell: bash
        env:
          LAUNCH_REPORT: ${{ runner.temp }}/browser-launch.json
        # `node --input-type=module` on stdin, with the working directory inside packages/ui, so the
        # bare `playwright` specifier resolves. A probe written to /tmp does NOT resolve — Node walks
        # up from the script's own directory, not from the workspace. Verified locally: this exact
        # form reports 3/3 on a machine with an Aqua session.
        working-directory: packages/ui
        run: |
          set -uo pipefail
          OUT="$(node --input-type=module <<'PROBE' 2>&1
          import { writeFileSync } from "node:fs";
          import { chromium, firefox, webkit } from "playwright";
          const results = [];
          for (const [name, engine] of [["chromium", chromium], ["firefox", firefox], ["webkit", webkit]]) {
            try {
              const browser = await engine.launch();
              const page = await browser.newPage();
              await page.setContent("<h1 id=t>ok</h1>");
              const text = await page.textContent("#t");
              await browser.close();
              results.push([name, text === "ok" ? "LAUNCHED" : "launched but wrong content"]);
            } catch (error) {
              results.push([name, `FAILED — ${String(error.message).split("\n")[0]}`]);
            }
          }
          for (const [name, status] of results) console.log(`${name.padEnd(9)} ${status}`);
          const ok = results.filter(([, s]) => s === "LAUNCHED").length;
          writeFileSync(process.env.LAUNCH_REPORT, JSON.stringify({
            schema: 1,
            kind: "vegastack-browser-launch-diagnostic",
            state: ok === 3 ? "pass" : "fail",
            attempted: results.length,
            passed: ok,
            observations: results.map(([engine, status]) => ({
              engine,
              state: status === "LAUNCHED" ? "pass" : "fail",
              detail: status,
            })),
          }, null, 2) + "\n", { flag: "wx", mode: 0o600 });
          console.log(`${ok}/3 engines launched`);
          process.stdout.write(`__ENGINES_OK__=${ok}\n`);
          PROBE
          )"
          echo "$OUT"
          OK="$(printf '%s' "$OUT" | sed -n 's/^__ENGINES_OK__=//p' | tail -1)"
          echo "engines_ok=${OK:-0}" >> "$GITHUB_OUTPUT"
          test "${OK:-0}" = "3"

      # ── the NON-BROWSER lane the local-first topology actually depends on ────────────────────────
      #
      # These diagnostics retain the current topology's non-browser oracle on the actual runner.
      # Earlier runs proved individual paths, but a manual diagnostic is a new dated observation,
      # never permission to infer that a later CI, Release, or Deploy run executed.
      #
      # Nothing about them is OS-specific and all three pass on a developer Mac, so the expected
      # result is green. Run it anyway: this repository's rule is that a gate never observed passing
      # on the machine that will run it is an assumption, and converting this one into a fact is free.
      # ORDER MATTERS: typecheck runs `prepare:content` for @vegastack/docs, and the docs lint chain
      # needs the generated `.source`. `ci.yml` gets this right by accident of ordering; this lane
      # proved it, failing here with `Cannot find package 'collections'` on the first dispatch. The
      # docs `lint` script now generates `.source` itself, so order no longer matters — but running
      # typecheck first still mirrors ci.yml, which is what this lane is meant to measure.
      - name: NON-BROWSER — typecheck (also generates the docs .source)
        id: typecheck
        continue-on-error: true
        run: pnpm typecheck

      - name: NON-BROWSER — the full static gate chain
        id: lint
        continue-on-error: true
        run: pnpm lint

      - name: NON-BROWSER — both discovery matrices build
        id: build_private
        continue-on-error: true
        env:
          SITE_VISIBILITY: private
        run: pnpm build

      - name: NON-BROWSER — the public docs export builds
        id: build_public
        continue-on-error: true
        env:
          SITE_VISIBILITY: public
        run: pnpm --filter @vegastack/docs build

      - name: NON-BROWSER — registry build is idempotent here
        id: registry
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          pnpm registry:build || exit 1
          git status --porcelain > "$RUNNER_TEMP/git-status"
          if [ -s "$RUNNER_TEMP/git-status" ]; then
            echo "registry:build is NOT idempotent on this runner:"
            cat "$RUNNER_TEMP/git-status"
            exit 1
          fi
          echo "registry:build left a clean tree"

      # The heaviest remaining mini lane: measured at 3m45s locally and single-threaded, and entirely
      # offline (every server it needs is a 127.0.0.1 sidecar), which is why it is safe here at all.
      - name: NON-BROWSER — shadcn consume round-trip
        id: consume
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          START="$(date +%s)"
          pnpm registry:verify-consume
          STATUS=$?
          echo "consume wall clock: $(( ($(date +%s) - START) / 60 ))m$(( ($(date +%s) - START) % 60 ))s"
          exit $STATUS

      - name: Vitest browser mode (a single real component test)
        id: browser_unit
        continue-on-error: true
        run: pnpm --filter @vegastack/ui exec vitest run registry/ui/badge.test.tsx

      - name: DEEP — full three-engine unit suite (the lane that needed the container)
        id: all_browsers
        if: ${{ inputs.deep }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @vegastack/ui test:all-browsers \
            --observation \
            --run-id "$DIAGNOSTIC_RUN_ID" \
            --report ".gates/diagnostics/runner/$DIAGNOSTIC_RUN_ID/all-browsers.json"

      - name: DEEP — contract suite, timed, at native worker count
        id: contracts
        if: ${{ inputs.deep }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          START="$(date +%s)"
          node tooling/contracts-run.mjs --all --observation \
            --run-id "$DIAGNOSTIC_RUN_ID" \
            --report ".gates/diagnostics/runner/$DIAGNOSTIC_RUN_ID/contracts.json"
          echo "contract suite wall clock: $(( ($(date +%s) - START) / 60 ))m$(( ($(date +%s) - START) % 60 ))s"

      - name: Read structured browser and contract reports
        id: structured-reports
        if: ${{ always() }}
        env:
          DEEP: ${{ inputs.deep }}
          LAUNCH_OUTCOME: ${{ steps.launch.outcome }}
          ALL_BROWSERS_OUTCOME: ${{ steps.all_browsers.outcome }}
          CONTRACTS_OUTCOME: ${{ steps.contracts.outcome }}
          LAUNCH_REPORT: ${{ runner.temp }}/browser-launch.json
          ALL_BROWSERS_REPORT: .gates/diagnostics/runner/${{ env.DIAGNOSTIC_RUN_ID }}/all-browsers.json
          CONTRACTS_REPORT: .gates/diagnostics/runner/${{ env.DIAGNOSTIC_RUN_ID }}/contracts.json
          DIAGNOSTIC_RUN_ID: ${{ env.DIAGNOSTIC_RUN_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          import { BROWSER_ENGINES, FULL_CONTRACT_TESTS } from './tooling/lib/gate-profile.mjs';
          import { expectedContractLeaves, reconcileContractLeaves } from './tooling/lib/contract-selection.mjs';
          import { workingTreeContentHash } from './tooling/lib/change-set.mjs';
          import { gateGeneration, localEnvironment } from './tooling/lib/measurement-report.mjs';
          import { createRouteScopeModel } from './tooling/lib/route-scope.mjs';
          import { vitestFullTestInventory } from './tooling/lib/smoke-scope.mjs';
          const currentTree = workingTreeContentHash().hash;
          const currentGeneration = gateGeneration();
          const currentEnvironment = localEnvironment().profile;
          const contractModel = createRouteScopeModel();
          contractModel.assertCurrent();
          const fullContractRoutes = [...contractModel.componentRoutes].sort();
          const read = (path) => {
            if (!existsSync(path)) return null;
            try { return JSON.parse(readFileSync(path, 'utf8')); } catch { return { corrupt: true }; }
          };
          const launch = read(process.env.LAUNCH_REPORT);
          const launchState =
            process.env.LAUNCH_OUTCOME === 'cancelled' ? 'not reached' :
            !launch || launch.corrupt ? 'unknown' :
            process.env.LAUNCH_OUTCOME === 'success' && launch.kind === 'vegastack-browser-launch-diagnostic' &&
              launch.state === 'pass' && launch.attempted === 3 && launch.passed === 3
              ? 'executed/pass' : 'executed/fail';
          const deepState = (path, outcome, gate) => {
            if (process.env.DEEP !== 'true') return 'skipped';
            if (outcome === 'cancelled') return 'not reached';
            const report = read(path);
            if (!report || report.corrupt) return 'unknown';
            const leaves = report.executedLeaves ?? [];
            const engines = new Set(leaves.map((leaf) => leaf.engine));
            const fullFiles = gate === 'all-browsers' ? vitestFullTestInventory() : [];
            const actualFiles = [...new Set(leaves.map((leaf) => leaf.file))].sort();
            const fullBrowser = gate !== 'all-browsers' ||
              (JSON.stringify(actualFiles) === JSON.stringify(fullFiles) &&
                BROWSER_ENGINES.every((engine) => engines.has(engine) &&
                  fullFiles.every((file) => leaves.some((leaf) =>
                    leaf.file === file && leaf.engine === engine && leaf.status === 'passed'))));
            let fullContracts = gate !== 'contracts';
            if (gate === 'contracts') {
              try {
                const expected = expectedContractLeaves({ routes: fullContractRoutes });
                const executed = reconcileContractLeaves(
                  expected,
                  report.leafEvidence?.executed?.leaves,
                  'runner diagnostic',
                  { requirePassed: true },
                );
                fullContracts = report.scope?.full === true &&
                  JSON.stringify(report.scope?.routes) === JSON.stringify(fullContractRoutes) &&
                  report.scope?.project === null && report.scope?.title === null &&
                  report.expected === FULL_CONTRACT_TESTS && report.executed === FULL_CONTRACT_TESTS &&
                  executed.expected === FULL_CONTRACT_TESTS && executed.executed === FULL_CONTRACT_TESTS;
              } catch { fullContracts = false; }
            }
            return outcome === 'success' && report.gate === gate &&
              report.runId === process.env.DIAGNOSTIC_RUN_ID &&
              report.status === 'pass' && report.state === 'executed/pass' &&
              report.diagnosticOnly === true && report.evidenceWritten === false &&
              report.receiptWritten === false && report.evidenceEligibility === 'diagnostic-only' &&
              report.treeBinding?.started === currentTree &&
              report.treeBinding?.completed === currentTree && report.treeBinding?.unchanged === true &&
              report.generation === currentGeneration &&
              report.environmentProfile === currentEnvironment &&
              Number.isInteger(report.executed) && report.executed > 0 &&
              fullBrowser && fullContracts
              ? 'executed/pass' : 'executed/fail';
          };
          const allBrowsersState = deepState(process.env.ALL_BROWSERS_REPORT, process.env.ALL_BROWSERS_OUTCOME, 'all-browsers');
          const contractsState = deepState(process.env.CONTRACTS_REPORT, process.env.CONTRACTS_OUTCOME, 'contracts');
          appendFileSync(process.env.GITHUB_OUTPUT, [
            `launch_state=${launchState}`,
            `all_browsers_state=${allBrowsersState}`,
            `contracts_state=${contractsState}`,
          ].join('\n') + '\n');
          NODE

      - name: Verdict
        if: ${{ always() }}
        shell: bash
        env:
          MANAGER: ${{ steps.session.outputs.manager }}
          GUI: ${{ steps.session.outputs.gui_domain }}
          CORES: ${{ steps.hw.outputs.cores }}
          ENGINES: ${{ steps.launch.outputs.engines_ok }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
          BUILD_PRIVATE: ${{ steps.build_private.outcome }}
          BUILD_PUBLIC: ${{ steps.build_public.outcome }}
          REGISTRY: ${{ steps.registry.outcome }}
          CONSUME: ${{ steps.consume.outcome }}
          BROWSER_UNIT: ${{ steps.browser_unit.outcome }}
          LAUNCH_STATE: ${{ steps.structured-reports.outputs.launch_state }}
          ALL_BROWSERS_STATE: ${{ steps.structured-reports.outputs.all_browsers_state }}
          CONTRACTS_STATE: ${{ steps.structured-reports.outputs.contracts_state }}
          DEEP: ${{ inputs.deep }}
        run: |
          set -uo pipefail
          state() {
            case "${1:-}" in
              success) echo "executed/pass" ;;
              failure) echo "executed/fail" ;;
              skipped) echo "skipped" ;;
              cancelled) echo "not reached" ;;
              *) echo "unknown" ;;
            esac
          }
          {
            echo "## Runner diagnostics"
            echo
            echo "| Fact | Value |"
            echo "| --- | --- |"
            echo "| launchd manager | \`${MANAGER:-?}\` (Aqua = GUI session) |"
            echo "| per-user Mach namespace | ${GUI:-?} |"
            echo "| logical cores | ${CORES:-?} |"
            echo "| engines that launched | ${ENGINES:-0}/3 |"
            echo "| typecheck | ${TYPECHECK:-?} |"
            echo "| static gate chain (pnpm lint) | ${LINT:-?} |"
            echo "| build, private visibility | ${BUILD_PRIVATE:-?} |"
            echo "| build, public docs export | ${BUILD_PUBLIC:-?} |"
            echo "| registry:build idempotent | ${REGISTRY:-?} |"
            echo "| consume round-trip | ${CONSUME:-?} |"
            echo "| browser launch probe | ${LAUNCH_STATE:-unknown} |"
            echo "| selected browser unit specimen | $(state "$BROWSER_UNIT") |"
            echo "| complete three-engine suite | ${ALL_BROWSERS_STATE:-unknown} |"
            echo "| complete contract suite | ${CONTRACTS_STATE:-unknown} |"
            echo
            echo "### The non-browser lane — what CI now depends on"
            echo
            NONBROWSER_FAILED=""
            for pair in "typecheck:${TYPECHECK:-}" "lint:${LINT:-}" "build-private:${BUILD_PRIVATE:-}" \
                        "build-public:${BUILD_PUBLIC:-}" "registry:${REGISTRY:-}" "consume:${CONSUME:-}"; do
              [ "${pair#*:}" = "success" ] || NONBROWSER_FAILED="$NONBROWSER_FAILED ${pair%%:*}"
            done
            if [ -z "$NONBROWSER_FAILED" ]; then
              echo "**Green.** Every job in \`ci.yml\`, plus \`release.yml\`'s validation and"
              echo "\`deploy.yml\`'s \`build-curated\`, can run here for free. This is the topology"
              echo "docs/plans/2026-07-25-cicd-local-first-revamp.md assumes."
            else
              echo "**Not green — this blocks the local-first topology**, because these jobs are"
              echo "supposed to be the free half. Failed:\`$NONBROWSER_FAILED\`. Read that step's log"
              echo "before re-pointing any workflow; do not assume it is environmental."
            fi
            echo
            if [ "${ENGINES:-0}" = "3" ]; then
              echo "**All three engines launch in this diagnostic.** This does not change the"
              echo "local-first policy or authorize moving browser lanes without a separate decision."
            elif [ "${ENGINES:-0}" = "0" ]; then
              echo "**No engine launches.** If \`launchd manager\` is not \`Aqua\`, the runner has no GUI"
              echo "session: reinstall it as a LaunchAgent under a logged-in user (or run \`./run.sh\`"
              echo "interactively while logged in) and re-run this job. Browser lanes remain on"
              echo "developer machines under current policy; do not add them to this runner."
            else
              echo "**Partial: ${ENGINES}/3.** Keep browser lanes local; see the launch step for the"
              echo "per-engine error."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

          FAILED=0
          [ "$LAUNCH_STATE" = "executed/pass" ] || FAILED=1
          for outcome in "$TYPECHECK" "$LINT" "$BUILD_PRIVATE" "$BUILD_PUBLIC" "$REGISTRY" "$CONSUME" "$BROWSER_UNIT"; do
            [ "$outcome" = "success" ] || FAILED=1
          done
          if [ "$DEEP" = "true" ]; then
            [ "$ALL_BROWSERS_STATE" = "executed/pass" ] || FAILED=1
            [ "$CONTRACTS_STATE" = "executed/pass" ] || FAILED=1
          else
            [ "$ALL_BROWSERS_STATE" = "skipped" ] || FAILED=1
            [ "$CONTRACTS_STATE" = "skipped" ] || FAILED=1
          fi
          exit "$FAILED"
