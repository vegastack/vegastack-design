name: Release
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  SITE_VISIBILITY: public

jobs:
  changes:
    runs-on: [self-hosted, vsk-runners-mac-mini]
    outputs:
      visual: ${{ steps.detect.outputs.visual }}
      publish: ${{ steps.detect.outputs.publish }}
      has_changesets: ${{ steps.detect.outputs.has_changesets }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BEFORE="$BEFORE_SHA"
          if ! git rev-parse --verify -q "$BEFORE" >/dev/null 2>&1 || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="${CURRENT_SHA}~1"
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "$CURRENT_SHA")
          printf 'changed files:\n%s\n' "$CHANGED"
          # Two subtractions, both aimed at the same thing: a pure version bump must not re-run the
          # 768-check browser gate over pages whose rendered output cannot have moved.
          #
          #   1. package.json / CHANGELOG.md — what `changeset version` rewrites directly.
          #   2. provenance-header-only diffs. `pnpm run version-packages` also runs version-sync,
          #      which runs registry:build, which re-stamps
          #      `// @vegastack <name>@<version> sha256-<sha>` into EVERY component source and docs
          #      copy-in — 1082 files on a 538-item registry. Those paths are legitimately in the
          #      visual list, so a filename-level filter CANNOT tell that one-line comment apart
          #      from a real component change; it has to read the diff body. Verified against a
          #      simulated Version Packages merge: filename-only filtering still reported visual.
          CANDIDATES=$(printf '%s\n' "$CHANGED" \
            | grep -vE '(^|/)(package\.json|CHANGELOG\.md)$' \
            | grep -E '^(packages/ui/registry/|packages/ui/src/|packages/design/|packages/design-tokens/|apps/docs/components/|apps/docs/app/|apps/docs/lib/|apps/docs/vrt/contracts\.spec\.ts|pnpm-lock\.yaml)' || true)
          VISUAL=""
          if [ -n "$CANDIDATES" ]; then
            # `--no-renames` matters: with rename detection a moved component emits `rename from/to`
            # and NO +/- body lines, so the filter below would see nothing and wave it through.
            # Forcing delete+add makes a rename look like what it is. Binary files never emit body
            # lines either, so they are matched explicitly. (Mode-only changes are deliberately not
            # visual — chmod cannot move a pixel.)
            DIFF=$(printf '%s\n' "$CANDIDATES" | tr '\n' '\0' \
              | xargs -0 git diff -U0 --no-renames "$BEFORE" "$CURRENT_SHA" --)
            # `-U0` so only changed lines appear; drop the +++/--- file markers; then drop the
            # provenance header. Anything left is a real change to a rendered surface.
            VISUAL=$(printf '%s\n' "$DIFF" \
              | grep -E '^([+-]|Binary files )' \
              | grep -vE '^(\+\+\+|---)' \
              | grep -vE '^[+-]// @vegastack [a-z0-9-]+@[0-9]' || true)
          fi
          if [ -n "$VISUAL" ]; then
            printf 'visual-surface candidates:\n%s\n' "$CANDIDATES"
            printf 'substantive changed lines (first 40):\n%s\n' "$(printf '%s\n' "$VISUAL" | head -40)"
            echo "visual=true" >> "$GITHUB_OUTPUT"
          else
            echo "no rendered-surface change beyond provenance re-stamping"
            echo "visual=false" >> "$GITHUB_OUTPUT"
          fi
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' -print -quit | grep -q .; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
            if echo "$CHANGED" | grep -qE '^packages/'; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  # Release-blocking visual-surface gate: 768 behaviour contracts (320px reflow, RTL containment,
  # forced-colors focus, effective 24px pointer targets) over every component route. No screenshots,
  # no baselines — nothing here can be cleared by regenerating its own evidence. Pixel review is a
  # human step run locally during `/ship` (tooling/vrt-review.mjs).
  # GITHUB-HOSTED: drives Chromium, which the mac minis cannot launch — see ci.yml's `verify`.
  contracts-gate:
    needs: changes
    if: needs.changes.outputs.visual == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vegastack/docs exec playwright install --with-deps chromium
      - run: pnpm exec turbo run build --filter=@vegastack/docs^...
      # Persistent runner: bind a free port rather than a fixed one, and reap it below. A cancelled
      # job kills Playwright without running webServer teardown, and `reuseExistingServer: false`
      # makes the next run throw on a held port — a fixed port would brick that mini.
      - name: Reserve a free capture port
        run: |
          set -euo pipefail
          PORT=$(node -e 'const s=require("net").createServer();s.listen(0,"127.0.0.1",()=>{process.stdout.write(String(s.address().port));s.close()})')
          echo "VRT_PORT=$PORT" >> "$GITHUB_ENV"
      # The reporter set (list + html + json) comes from playwright.config.ts under CI, so no
      # `--reporter` flag is needed — and none should be added: `--reporter` is also a pnpm flag and
      # would be swallowed before Playwright saw it.
      - name: Component contract gate
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: contracts-report.json
        run: pnpm --filter @vegastack/docs test:contracts
      # A suite that executed ZERO tests (fully skipped, empty, or mis-filtered) must not be read as
      # passing evidence for a release.
      - name: Guard — fail if zero contract tests executed
        working-directory: apps/docs
        run: |
          node -e '
            const r = require("./contracts-report.json");
            const ran = (r.stats?.expected||0)+(r.stats?.unexpected||0)+(r.stats?.flaky||0);
            if (ran === 0) { console.error("✗ Contract gate executed 0 tests — not valid passing evidence for a release."); process.exit(1); }
            console.log(`✓ Contract gate executed ${ran} test(s).`);
          '
      - name: Upload the failing run's report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contracts-failure-${{ github.run_id }}
          path: |
            apps/docs/playwright-report
            apps/docs/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Reap the capture server
        if: ${{ always() }}
        run: |
          PIDS=$(lsof -ti "tcp:${VRT_PORT:-0}" 2>/dev/null || true)
          if [ -n "$PIDS" ]; then echo "killing leftover server: $PIDS"; kill -9 $PIDS || true; fi

  # Repository code and dependencies are validated without write or OIDC authority.
  quality-gate:
    needs: [changes, contracts-gate]
    if: >-
      always() && needs.changes.outputs.publish == 'true' &&
      (needs.contracts-gate.result == 'success' ||
       (needs.contracts-gate.result == 'skipped' && needs.changes.outputs.visual == 'false'))
    # GITHUB-HOSTED: drives Chromium/Firefox/WebKit, which the mac minis cannot launch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vegastack/ui exec playwright install --with-deps chromium firefox webkit
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @vegastack/ui test:all-browsers
      - run: pnpm build
      - run: pnpm registry:build
      - name: Require registry build idempotency
        run: |
          set -euo pipefail
          git status --porcelain > "$RUNNER_TEMP/git-status"
          if [ -s "$RUNNER_TEMP/git-status" ]; then
            echo "::error title=Generated registry drift::registry:build changed the checked-out release commit."
            cat "$RUNNER_TEMP/git-status"
            exit 1
          fi
      - run: pnpm registry:verify-consume
      - name: Upload validated public-package build outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package-dist-${{ github.sha }}
          path: |
            packages/design/dist
            packages/design-tokens/dist
          if-no-files-found: error
          retention-days: 1

  # A changeset-bearing, reviewed main commit creates or updates the Version Packages PR. This job
  # has write authority for that PR but cannot mint npm OIDC. Merging the reviewed Version PR is
  # the separate human action that authorizes publication on the next main run.
  version-pr:
    needs: [changes, quality-gate]
    if: >-
      needs.changes.outputs.has_changesets == 'true' &&
      needs.quality-gate.result == 'success'
    runs-on: [self-hosted, vsk-runners-mac-mini]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run version-packages
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishing is isolated from validation and is the only release job with npm OIDC authority.
  # It is reachable only after a reviewed Version Packages PR has removed the pending changesets.
  # The trusted-publisher identity is repository + release.yml, matching the proven 0.1.1 path.
  #
  # GITHUB-HOSTED BY HARD REQUIREMENT: npm trusted publishing does not support self-hosted runners
  # ("Self-hosted runners are not currently supported but are planned for future releases" —
  # https://docs.npmjs.com/trusted-publishers/). This repository deliberately holds no NPM_TOKEN, so
  # moving this job would break publishing outright. It runs ~2 minutes and executes no repository
  # code — it only downloads the artifact quality-gate already validated.
  publish:
    needs: [changes, quality-gate]
    if: >-
      needs.changes.outputs.has_changesets == 'false' &&
      needs.quality-gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Pin npm to the reviewed OIDC-capable release
        run: npm install -g npm@11.16.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: npm-package-dist-${{ github.sha }}
          path: packages
      - name: Reject publish-time lifecycle code
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const lifecycle = ['prepublish', 'prepare', 'prepublishOnly', 'prepack', 'postpack', 'publish', 'postpublish', 'preinstall', 'install', 'postinstall'];
          for (const directory of ['design', 'design-tokens']) {
            const pkg = JSON.parse(readFileSync(`packages/${directory}/package.json`, 'utf8'));
            for (const name of lifecycle) {
              if (pkg.scripts?.[name]) throw new Error(`${pkg.name} must not execute ${name} with npm OIDC authority`);
            }
          }
          NODE
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm changeset publish
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
