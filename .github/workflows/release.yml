name: Release
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  SITE_VISIBILITY: public

# COST SHAPE. Only two jobs are GitHub-hosted, for two unrelated hard reasons:
#
#   package-build   EPHEMERAL EXACT-BYTE PRODUCER. `publish` uploads the immutable artifact this job
#                   creates, keeping persistent self-hosted runner state outside the public package
#                   build. This private source repository cannot receive npm provenance attestations.
#                   ~4 minutes for the two public packages, no browsers, no container.
#   publish         npm trusted publishing does not support self-hosted runners
#                   (https://docs.npmjs.com/trusted-publishers/) and this repository deliberately
#                   holds no NPM_TOKEN, so moving it would break publishing outright. ~2 minutes,
#                   and it executes no repository code — it only downloads the validated artifact.
#
# Everything else runs free on the mac minis. The browser lanes are not here at all: they run in
# `.husky/pre-push` and are attested by `.gates/receipt.json`, which `receipt-guard` verifies.
jobs:
  # What does this push require, and what will it DO? One authority, called rather than reimplemented
  # in shell — tooling/classify-change.mjs. That logic lived here as bash and was wrong in both
  # directions on 2026-07-25 (first demanding the 768-check gate for a pure version bump across 1082
  # provenance-re-stamped files, then reporting no change for a real component edit while exiting 0).
  # tooling/verify-classify-change.mjs now proves both directions against those actual commits.
  changes:
    runs-on: [self-hosted, vsk-runners-mac-mini]
    permissions:
      contents: read
      pull-requests: read
    outputs:
      contracts: ${{ steps.detect.outputs.contracts }}
      unit: ${{ steps.detect.outputs.unit }}
      smoke: ${{ steps.detect.outputs.smoke }}
      release_state: ${{ steps.state.outputs.release_state }}
      release_required: ${{ steps.state.outputs.release_required }}
      version_pr: ${{ steps.state.outputs.version_pr }}
      npm_publish: ${{ steps.state.outputs.npm_publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24 }
      - id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BEFORE="$BEFORE_SHA"
          if ! git rev-parse --verify -q "$BEFORE" >/dev/null 2>&1 || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="${CURRENT_SHA}~1"
          fi
          node tooling/classify-change.mjs --before "$BEFORE" --after "$CURRENT_SHA"
      - id: state
        name: Resolve resumable release state
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BEFORE="$BEFORE_SHA"
          if ! git rev-parse --verify -q "$BEFORE" >/dev/null 2>&1 || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="${CURRENT_SHA}~1"
          fi
          node tooling/release-state.mjs \
            --before "$BEFORE" \
            --after "$CURRENT_SHA" \
            --require-github \
            --report .gates/release-state.json
      - name: Summarize release decision
        if: always()
        env:
          STATE: ${{ steps.state.outputs.release_state }}
          QUALITY: ${{ steps.state.outputs.release_required }}
          VERSION_PR: ${{ steps.state.outputs.version_pr }}
          NPM_PUBLISH: ${{ steps.state.outputs.npm_publish }}
        run: |
          {
            echo "## Release state"
            echo
            echo "| State | Quality | Version PR | Hosted npm build/publish |"
            echo "| --- | --- | --- | --- |"
            echo "| ${STATE:-unknown} | ${QUALITY:-unknown} | ${VERSION_PR:-unknown} | ${NPM_PUBLISH:-unknown} |"
            echo
            echo "A Version PR merge and any production deploy remain separate MK approval boundaries."
          } >> "$GITHUB_STEP_SUMMARY"

  # The browser half, attested rather than executed. See ci.yml's `receipt-guard` for what a receipt
  # is and is not. The requirements come from `changes` above so this job and the local runner cannot
  # disagree about what was needed.
  receipt-guard:
    needs: changes
    runs-on: [self-hosted, vsk-runners-mac-mini]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24 }
      - name: Verify the gate receipt covers this commit
        env:
          NEEDS_CONTRACTS: ${{ needs.changes.outputs.contracts }}
          NEEDS_UNIT: ${{ needs.changes.outputs.unit }}
          NEEDS_SMOKE: ${{ needs.changes.outputs.smoke }}
        run: |
          set -euo pipefail
          node tooling/verify-gate-receipt.mjs \
            --contracts "$NEEDS_CONTRACTS" \
            --unit "$NEEDS_UNIT" \
            --smoke "$NEEDS_SMOKE"

  # Repository code and dependencies are validated without write or OIDC authority. Free, on a mini,
  # and with no container: the container existed only for the three-engine browser suite, which now
  # runs locally.
  quality-gate:
    needs: [changes, receipt-guard]
    if: needs.changes.outputs.release_required == 'true'
    runs-on: [self-hosted, vsk-runners-mac-mini]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm exec turbo run test --filter=@vegastack/design
      - run: pnpm build
      - run: pnpm registry:build
      - name: Require registry build idempotency
        run: |
          set -euo pipefail
          git status --porcelain > "$RUNNER_TEMP/git-status"
          if [ -s "$RUNNER_TEMP/git-status" ]; then
            echo "::error title=Generated registry drift::registry:build changed the checked-out release commit."
            cat "$RUNNER_TEMP/git-status"
            exit 1
          fi
      # D1 remains open: release quality keeps the full fresh-root plus consolidated two-layout
      # consume oracle. A local affected report is diagnostic-only and cannot skip this step.
      - name: Full isolated and consolidated registry consume proof
        run: pnpm registry:verify-consume
      # D4 is not approved. This artifact is produced only because the exact-main, no-credential
      # quality job already had to build these bytes. Deploy records parity against its own rebuild;
      # it never signs or uploads this shadow candidate.
      - name: Create exact-main deploy candidate manifest (shadow only)
        env:
          CANDIDATE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_RUN_ID: ${{ github.run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ github.run_attempt }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node tooling/deploy-candidate.mjs create \
            --root . \
            --output apps/docs/deploy-candidate-manifest.json \
            --repository "$CANDIDATE_REPOSITORY" \
            --run-id "$CANDIDATE_RUN_ID" \
            --run-attempt "$CANDIDATE_RUN_ATTEMPT" \
            --sha "$CANDIDATE_SHA"
      - name: Upload exact-main deploy candidate (shadow only; never production input)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/docs/out
            apps/docs/wrangler.jsonc
            apps/docs/deploy-candidate-manifest.json
          if-no-files-found: error
          retention-days: 1
          overwrite: false

  # The npm artifact is built on an EPHEMERAL runner and handed to publish as one immutable artifact,
  # keeping persistent runner state outside the public-package build. The private source repository
  # cannot receive npm provenance attestations. This deliberate hosted cost is defense in depth; see
  # the header. The job runs after validation and produces nothing but the two public dists.
  # `npm_publish == 'true'` is based on exact name@version lookups. A registry-only run whose public
  # versions already exist, or a changeset-bearing run that only opens a Version PR, never reaches
  # this hosted job. Unknown registry state blocks in `changes`; it cannot be mistaken for missing.
  package-build:
    needs: [changes, quality-gate]
    if: >-
      needs.changes.outputs.npm_publish == 'true' &&
      needs.quality-gate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Only the two PUBLIC packages. `@vegastack/ui` is private by the locked distribution model and
      # must never reach this artifact.
      - run: pnpm --filter @vegastack/design-tokens build
      - run: pnpm --filter @vegastack/design build
      - run: node tooling/verify-package-exports.mjs
      - name: Upload validated public-package build outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package-dist-${{ github.sha }}
          path: |
            packages/design/dist
            packages/design-tokens/dist
          if-no-files-found: error
          retention-days: 1

  # A changeset-bearing, reviewed main commit creates or updates the Version Packages PR. This job
  # has write authority for that PR but cannot mint npm OIDC. Merging the reviewed Version PR is the
  # separate human action that authorizes publication on the next main run.
  version-pr:
    needs: [changes, quality-gate]
    if: >-
      needs.changes.outputs.version_pr == 'true' &&
      needs.quality-gate.result == 'success'
    runs-on: [self-hosted, vsk-runners-mac-mini]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run version-packages
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishing is isolated from validation and is the only release job with npm OIDC authority. It is
  # reachable only after a reviewed Version Packages PR has removed the pending changesets. The
  # trusted-publisher identity is repository + release.yml, matching the proven 0.1.1 path.
  #
  # GITHUB-HOSTED BY HARD REQUIREMENT: npm trusted publishing does not support self-hosted runners
  # ("Self-hosted runners are not currently supported but are planned for future releases" —
  # https://docs.npmjs.com/trusted-publishers/). This repository deliberately holds no NPM_TOKEN, so
  # moving this job would break publishing outright.
  publish:
    needs: [changes, quality-gate, package-build]
    if: >-
      needs.changes.outputs.npm_publish == 'true' &&
      needs.quality-gate.result == 'success' &&
      needs.package-build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Pin npm to the reviewed OIDC-capable release
        run: npm install -g npm@11.16.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: npm-package-dist-${{ github.sha }}
          path: packages
      - name: Reject publish-time lifecycle code
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const lifecycle = ['prepublish', 'prepare', 'prepublishOnly', 'prepack', 'postpack', 'publish', 'postpublish', 'preinstall', 'install', 'postinstall'];
          for (const directory of ['design', 'design-tokens']) {
            const pkg = JSON.parse(readFileSync(`packages/${directory}/package.json`, 'utf8'));
            for (const name of lifecycle) {
              if (pkg.scripts?.[name]) throw new Error(`${pkg.name} must not execute ${name} with npm OIDC authority`);
            }
          }
          NODE
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm changeset publish
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact public versions after publish
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BEFORE="$BEFORE_SHA"
          if ! git rev-parse --verify -q "$BEFORE" >/dev/null 2>&1 || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="${CURRENT_SHA}~1"
          fi
          node tooling/release-state.mjs \
            --before "$BEFORE" \
            --after "$CURRENT_SHA" \
            --report "$RUNNER_TEMP/post-publish-release-state.json"
