name: Release

# A merge to main IS the release (operator, 30-10-2026). With pending changesets this workflow cuts
# the version commit itself, pushes it to main as the `vegastack-design-release` GitHub App (the
# ruleset's only bypass actor), publishes the missing npm versions with OIDC, and deploys the
# registry and docs. There is no Version Packages PR. `workflow_dispatch` resumes a failed run at the
# current main tip: every step is idempotent (npm versions that exist are skipped).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_VISIBILITY: public

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  publish:
    name: Version and publish
    runs-on: [self-hosted, linux, vsk-runner]
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      volumes:
        # Trusted store: mounted only by release and deploy, never by a job that runs PR code.
        - /opt/vsk-runner/pnpm-store-trusted:/pnpm-store-trusted
    defaults:
      run:
        shell: bash
    env:
      npm_config_cache: /tmp/npm-cache
    permissions:
      contents: read
      id-token: write
    outputs:
      release_sha: ${{ steps.version.outputs.release_sha }}
      deploy: ${{ steps.version.outputs.deploy }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Only the current main tip releases
        id: tip
        env:
          EVENT: ${{ github.event_name }}
          PUSHED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A newer push has its own queued run; this one has nothing left to do.
          if [ "$EVENT" = push ] && [ "$(git rev-parse HEAD)" != "$PUSHED_SHA" ]; then
            echo "::notice::main moved past $PUSHED_SHA; the newer run releases"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.tip.outputs.stale == 'false'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Enable corepack
        if: steps.tip.outputs.stale == 'false'
        run: corepack enable
      - name: Pin the OIDC-capable npm (>= 11.5)
        if: steps.tip.outputs.stale == 'false'
        run: npm install -g npm@11.16.0 # zizmor: ignore[adhoc-packages]
      - if: steps.tip.outputs.stale == 'false'
        run: pnpm install --frozen-lockfile --ignore-scripts --store-dir /pnpm-store-trusted
      - name: Cut the version commit
        id: version
        if: steps.tip.outputs.stale == 'false'
        env:
          EVENT: ${{ github.event_name }}
          # @changesets/changelog-github reads PR and author links (read-only API).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PENDING=false
          for file in .changeset/*.md; do
            [ "$file" != .changeset/README.md ] && [ -e "$file" ] && PENDING=true
          done
          if [ "$PENDING" = true ]; then
            pnpm run version-packages
            git config user.name "vegastack-design-release[bot]"
            git config user.email "5543586+vegastack-design-release[bot]@users.noreply.github.com"
            git add -A
            VERSION=$(node -p "require('./packages/ui/package.json').version")
            git commit -q -m "chore(release): registry ${VERSION} [skip ci]"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            # Nothing pending: a manual resume still redeploys the current tip.
            if [ "$EVENT" = workflow_dispatch ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; else echo "deploy=false" >> "$GITHUB_OUTPUT"; fi
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Mint the release App token
        id: app-token
        if: steps.version.outputs.pending == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Push the version commit to main
        if: steps.version.outputs.pending == 'true'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Fast-forward only: if main moved, the push is rejected and the newer run releases.
          git push "https://x-access-token:${TOKEN}@github.com/${REPO}.git" HEAD:refs/heads/main
      - name: Build the public packages
        if: steps.tip.outputs.stale == 'false'
        run: |
          set -euo pipefail
          pnpm --filter @vegastack/design-tokens build
          pnpm --filter @vegastack/design build
      - name: Reject publish-time lifecycle code
        if: steps.tip.outputs.stale == 'false'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const lifecycle = ['prepublish', 'prepare', 'prepublishOnly', 'prepack', 'postpack', 'publish', 'postpublish', 'preinstall', 'install', 'postinstall'];
          for (const directory of ['design', 'design-tokens']) {
            const pkg = JSON.parse(readFileSync(`packages/${directory}/package.json`, 'utf8'));
            for (const name of lifecycle) {
              if (pkg.scripts?.[name]) throw new Error(`${pkg.name} must not execute ${name} with npm OIDC authority`);
            }
          }
          NODE
      - name: Publish missing versions (OIDC, no token)
        if: steps.tip.outputs.stale == 'false'
        run: |
          set -euo pipefail
          for dir in design-tokens design; do
            cd "$GITHUB_WORKSPACE/packages/$dir"
            NAME=$(node -p "require('./package.json').name")
            VERSION=$(node -p "require('./package.json').version")
            for attempt in 1 2 3; do
              if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
                echo "$NAME@$VERSION is published"
                break
              fi
              if npm publish --access public --no-provenance; then
                break
              fi
              test "$attempt" -lt 3 || exit 1
              sleep $((attempt * 10))
            done
          done

  deploy:
    name: Deploy registry and docs
    needs: publish
    if: needs.publish.outputs.deploy == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml # zizmor: ignore[self-repository]
    with:
      expected_sha: ${{ needs.publish.outputs.release_sha }}
    secrets:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
