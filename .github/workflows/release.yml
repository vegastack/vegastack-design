name: Release

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact tested main commit authorized by “ship it”
        required: true
        type: string

permissions:
  contents: read

env:
  SITE_VISIBILITY: public

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  version:
    name: Create release commit
    runs-on: [self-hosted, vsk-runners-mac-mini]
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_sha }}
      - name: Require the authorized main tip
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA" || {
            echo "::error title=Stale ship authorization::main moved after $EXPECTED_SHA was authorized"
            exit 1
          }
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24 }
      - name: Fetch the enforced main ruleset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ID=$(gh api "repos/$GITHUB_REPOSITORY/rulesets" --jq '.[] | select(.name == "VegaStack main") | .id')
          test -n "$ID"
          gh api "repos/$GITHUB_REPOSITORY/rulesets/$ID" > "$RUNNER_TEMP/main-ruleset.json"
      - name: Require affected PR protection before releasing
        run: node tooling/main-ruleset.mjs --check-file "$RUNNER_TEMP/main-ruleset.json"
      - run: pnpm install --frozen-lockfile --ignore-scripts --store-dir "$RUNNER_WORKSPACE/pnpm-store"
      - id: release
        name: Version every pending changeset and create one release commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          # @changesets/changelog-github reads PR/author metadata while writing package changelogs.
          # This job also pushes the generated commit, so the token is contents:write; exact-main,
          # ruleset and release-output guards bound that authority.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git branch -f main "$EXPECTED_SHA"
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md | grep -q .; then
            pnpm version-packages
            node tooling/changelog-lint.mjs
            node tooling/sync-changelog.mjs --check
            pnpm design:derived:check
            node tooling/verify-component-contracts.mjs
            node tooling/verify-release-output-scope.mjs --base "$EXPECTED_SHA"
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git commit -m "chore: release packages [skip ci]"
            RELEASE_SHA=$(git rev-parse HEAD)
            echo "has_commit=true" >> "$GITHUB_OUTPUT"
          else
            # Resume only the direct release commit written by a prior interrupted run. A normal
            # main commit with no changeset is not silently promoted to a release.
            test "$(git log -1 --format=%s)" = "chore: release packages [skip ci]" || {
              echo "::error title=No release input::main has no pending changeset and is not a generated release commit"
              exit 1
            }
            RELEASE_SHA="$EXPECTED_SHA"
            echo "has_commit=false" >> "$GITHUB_OUTPUT"
          fi
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
      - name: Push the generated release commit
        if: steps.release.outputs.has_commit == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Install gh's credential helper only after repository code has finished. The token stays
          # in the environment rather than appearing in git's world-readable argv.
          gh auth setup-git
          git push origin HEAD:main

  publish:
    name: Publish public packages
    needs: version
    runs-on: [self-hosted, vsk-runners-mac-mini]
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.version.outputs.release_sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Pin npm to the reviewed OIDC-capable release
        run: npm install -g npm@11.16.0
      - run: pnpm install --frozen-lockfile --ignore-scripts --store-dir "$RUNNER_WORKSPACE/pnpm-store"
      - run: pnpm --filter @vegastack/design-tokens build
      - run: pnpm --filter @vegastack/design build
      - run: node tooling/verify-package-exports.mjs
      - name: Reject publish-time lifecycle code
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const lifecycle = ['prepublish', 'prepare', 'prepublishOnly', 'prepack', 'postpack', 'publish', 'postpublish', 'preinstall', 'install', 'postinstall'];
          for (const directory of ['design', 'design-tokens']) {
            const pkg = JSON.parse(readFileSync(`packages/${directory}/package.json`, 'utf8'));
            for (const name of lifecycle) {
              if (pkg.scripts?.[name]) throw new Error(`${pkg.name} must not execute ${name} with npm OIDC authority`);
            }
          }
          NODE
      - name: Publish missing versions with three bounded attempts
        run: |
          set -euo pipefail
          for dir in design-tokens design; do
            cd "$GITHUB_WORKSPACE/packages/$dir"
            NAME=$(node -p "require('./package.json').name")
            VERSION=$(node -p "require('./package.json').version")
            for attempt in 1 2 3; do
              if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
                echo "$NAME@$VERSION is already published"
                break
              fi
              if npm publish --access public --no-provenance; then
                break
              fi
              if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
                echo "$NAME@$VERSION became visible after the publish response failed"
                break
              fi
              test "$attempt" -lt 3 || exit 1
              sleep $((attempt * 10))
            done
          done

  dispatch-deploy:
    name: Dispatch public distribution deploy
    needs: [version, publish]
    runs-on: [self-hosted, vsk-runners-mac-mini]
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch the exact release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.version.outputs.release_sha }}
        run: |
          set -euo pipefail
          BEFORE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --limit 20 --json databaseId --jq '.[].databaseId')
          for attempt in 1 2 3; do
            if gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f expected_sha="$RELEASE_SHA"; then
              exit 0
            fi
            # workflow_dispatch has returned HTTP 500 after accepting a run. Treat a new run for the
            # release SHA as success rather than creating duplicates.
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$RELEASE_SHA\") | .databaseId" | head -1)
            if [ -n "$RUN_ID" ] && ! grep -qx "$RUN_ID" <<<"$BEFORE"; then
              echo "deploy run $RUN_ID exists despite the dispatch error"
              exit 0
            fi
            test "$attempt" -lt 3 || exit 1
            sleep $((attempt * 10))
          done
