name: Release
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  SITE_VISIBILITY: public

# COST SHAPE. Nothing here is GitHub-hosted. Every job runs on the self-hosted mac minis, so a
# release costs zero billable minutes — required after an account-level billing lock suspended all
# GitHub-hosted runners (hosted jobs start with zero steps executed). Two jobs used to be on
# ubuntu-latest; both moved to the minis, and publishing still works exactly as before:
#
#   package-build   Builds the two public dists into a validated artifact that `publish` consumes.
#                   ~4 minutes, no browsers, no container.
#   publish         Publishes token-free over npm OIDC TRUSTED PUBLISHING — which works on self-hosted
#                   runners; only the provenance BUNDLE requires a GitHub-hosted runner, so publishing
#                   sets provenance=false. (No attestation is lost: the source repo is private, so npm
#                   emitted none even from ubuntu-latest.) Auth is unchanged from the proven flow —
#                   still the repository + release.yml trusted-publisher identity, no NPM_TOKEN.
#
# The move to self-hosted mirrors sibling repo vegastack/vegafactory, which publishes the same way.
#
# The browser lanes are not here at all: they run in `.husky/pre-push` and are attested by
# `.gates/receipt.json`, which `receipt-guard` verifies.
jobs:
  # What does this push require, and what will it DO? One authority, called rather than reimplemented
  # in shell — tooling/classify-change.mjs. That logic lived here as bash and was wrong in both
  # directions on 2026-07-25 (first demanding the 768-check gate for a pure version bump across 1082
  # provenance-re-stamped files, then reporting no change for a real component edit while exiting 0).
  # tooling/verify-classify-change.mjs now proves both directions against those actual commits.
  changes:
    runs-on: [self-hosted, vsk-runners-mac-mini]
    outputs:
      contracts: ${{ steps.detect.outputs.contracts }}
      unit: ${{ steps.detect.outputs.unit }}
      smoke: ${{ steps.detect.outputs.smoke }}
      publish: ${{ steps.detect.outputs.publish }}
      has_changesets: ${{ steps.detect.outputs.has_changesets }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24 }
      - id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BEFORE="$BEFORE_SHA"
          if ! git rev-parse --verify -q "$BEFORE" >/dev/null 2>&1 || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="${CURRENT_SHA}~1"
          fi
          # --check-npm so an INTERRUPTED release can resume. Versions can sit bumped-but-unpublished
          # on main; without asking the registry, no later push would ever set publish=true again.
          node tooling/classify-change.mjs --before "$BEFORE" --after "$CURRENT_SHA" --check-npm

  # The browser half, attested rather than executed. See ci.yml's `receipt-guard` for what a receipt
  # is and is not. The requirements come from `changes` above so this job and the local runner cannot
  # disagree about what was needed.
  receipt-guard:
    needs: changes
    runs-on: [self-hosted, vsk-runners-mac-mini]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24 }
      - name: Verify the gate receipt covers this commit
        env:
          NEEDS_CONTRACTS: ${{ needs.changes.outputs.contracts }}
          NEEDS_UNIT: ${{ needs.changes.outputs.unit }}
          NEEDS_SMOKE: ${{ needs.changes.outputs.smoke }}
        run: |
          set -euo pipefail
          node tooling/verify-gate-receipt.mjs \
            --contracts "$NEEDS_CONTRACTS" \
            --unit "$NEEDS_UNIT" \
            --smoke "$NEEDS_SMOKE"

  # Repository code and dependencies are validated without write or OIDC authority. Free, on a mini,
  # and with no container: the container existed only for the three-engine browser suite, which now
  # runs locally.
  quality-gate:
    needs: [changes, receipt-guard]
    if: needs.changes.outputs.publish == 'true'
    runs-on: [self-hosted, vsk-runners-mac-mini]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm exec turbo run test --filter=@vegastack/design
      - run: pnpm build
      - run: pnpm registry:build
      - name: Require registry build idempotency
        run: |
          set -euo pipefail
          git status --porcelain > "$RUNNER_TEMP/git-status"
          if [ -s "$RUNNER_TEMP/git-status" ]; then
            echo "::error title=Generated registry drift::registry:build changed the checked-out release commit."
            cat "$RUNNER_TEMP/git-status"
            exit 1
          fi
      - run: pnpm registry:verify-consume

  # The npm artifact, built in a job of its own so `publish` consumes validated bytes and runs no
  # repository build code itself. It runs after validation and produces nothing but the two public dists.
  # `has_changesets == 'false'` is what confines this to the PUBLISH path. A changeset-bearing run
  # opens a Version PR and publishes nothing, so building the npm artifact there would produce bytes no
  # job consumes.
  package-build:
    needs: [changes, quality-gate]
    if: >-
      needs.changes.outputs.publish == 'true' &&
      needs.changes.outputs.has_changesets == 'false'
    runs-on: [self-hosted, vsk-runners-mac-mini]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Only the two PUBLIC packages. `@vegastack/ui` is private by the locked distribution model and
      # must never reach this artifact.
      - run: pnpm --filter @vegastack/design-tokens build
      - run: pnpm --filter @vegastack/design build
      - run: node tooling/verify-package-exports.mjs
      - name: Upload validated public-package build outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package-dist-${{ github.sha }}
          path: |
            packages/design/dist
            packages/design-tokens/dist
          if-no-files-found: error
          retention-days: 1

  # A changeset-bearing, reviewed main commit creates or updates the Version Packages PR. This job
  # has write authority for that PR but cannot mint npm OIDC. Merging the reviewed Version PR is the
  # separate human action that authorizes publication on the next main run.
  version-pr:
    needs: [changes, quality-gate]
    if: >-
      needs.changes.outputs.has_changesets == 'true' &&
      needs.quality-gate.result == 'success'
    runs-on: [self-hosted, vsk-runners-mac-mini]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run version-packages
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishing is isolated from validation and is the only release job with npm OIDC authority. It is
  # reachable only after a reviewed Version Packages PR has removed the pending changesets. The
  # trusted-publisher identity is repository + release.yml, matching the proven publish path.
  #
  # AUTH: npm OIDC TRUSTED PUBLISHING, token-free — and it works on self-hosted runners (sibling repo
  # vegastack/vegafactory publishes the same way). Only the provenance BUNDLE requires a GitHub-hosted
  # runner, so this job sets provenance=false (NPM_CONFIG_PROVENANCE). No attestation is lost: the
  # source repo is private, so npm emitted none even from ubuntu-latest. This job runs no repository
  # build code; it only downloads the validated artifact and publishes it.
  publish:
    needs: [changes, quality-gate, package-build]
    if: >-
      needs.changes.outputs.has_changesets == 'false' &&
      needs.quality-gate.result == 'success' &&
      needs.package-build.result == 'success'
    runs-on: [self-hosted, vsk-runners-mac-mini]
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Pin npm to the reviewed OIDC-capable release
        # npm >= 11.5.1 speaks OIDC trusted publishing; this is the reviewed pin.
        run: npm install -g npm@11.16.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: npm-package-dist-${{ github.sha }}
          path: packages
      - name: Reject publish-time lifecycle code
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const lifecycle = ['prepublish', 'prepare', 'prepublishOnly', 'prepack', 'postpack', 'publish', 'postpublish', 'preinstall', 'install', 'postinstall'];
          for (const directory of ['design', 'design-tokens']) {
            const pkg = JSON.parse(readFileSync(`packages/${directory}/package.json`, 'utf8'));
            for (const name of lifecycle) {
              if (pkg.scripts?.[name]) throw new Error(`${pkg.name} must not execute ${name} with npm OIDC authority`);
            }
          }
          NODE
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm changeset publish
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Trusted publishing auto-enables provenance, whose bundle npm accepts only from a
          # GitHub-hosted runner; on the minis that generation fails. Disable it — the source repo is
          # private, so no attestation was ever produced anyway. Auth stays token-free OIDC.
          NPM_CONFIG_PROVENANCE: "false"
