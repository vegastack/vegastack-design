name: Release
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  SITE_VISIBILITY: public

# COST SHAPE. Nothing here is GitHub-hosted. Every job runs on self-hosted hardware — the mac minis,
# except `quality-gate`, which needs a container and therefore the LAN Linux boxes — so a
# release costs zero billable minutes — required after an account-level billing lock suspended all
# GitHub-hosted runners (hosted jobs start with zero steps executed). That same lock exhausts Actions
# artifact storage, so this workflow uses NO cross-job artifacts: the single `publish` job builds the
# two public packages and publishes them in place, token-free over npm OIDC TRUSTED PUBLISHING — which
# works on self-hosted runners; only the provenance BUNDLE requires a GitHub-hosted runner (npm rejects
# a self-hosted one with E422), so publish uses `npm publish --no-provenance`. The repo is public, so a
# hosted runner COULD attach provenance — but hosted runners are billing-locked, so releases ship
# without an attestation until that is resolved. Auth is unchanged from the proven flow — the
# repository + release.yml trusted-publisher identity, no NPM_TOKEN.
#
# The move to self-hosted mirrors sibling repo vegastack/vegafactory, which publishes the same way.
#
# VERIFICATION. `quality-gate` runs `pnpm verify` — the same command a developer runs, and the same
# command `ci.yml` runs — in the pinned Playwright container on the LAN Linux boxes, so the browser
# lanes are EXECUTED here rather than attested. The `receipt-guard` job that used to stand in for
# them is deleted along with `.gates/` (docs/plans/2026-09-08-verification-rebuild.md, R1).
jobs:
  # What does this push require, and what will it DO? One authority, called rather than reimplemented
  # in shell — tooling/classify-change.mjs. That logic lived here as bash and was wrong in both
  # directions on 2026-07-25 (first demanding the 768-check gate for a pure version bump across 1082
  # provenance-re-stamped files, then reporting no change for a real component edit while exiting 0).
  # tooling/verify-classify-change.mjs now proves both directions against those actual commits.
  changes:
    runs-on: [self-hosted, vsk-runners-mac-mini]
    outputs:
      contracts: ${{ steps.detect.outputs.contracts }}
      unit: ${{ steps.detect.outputs.unit }}
      smoke: ${{ steps.detect.outputs.smoke }}
      publish: ${{ steps.detect.outputs.publish }}
      has_changesets: ${{ steps.detect.outputs.has_changesets }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24 }
      - id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BEFORE="$BEFORE_SHA"
          if ! git rev-parse --verify -q "$BEFORE" >/dev/null 2>&1 || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="${CURRENT_SHA}~1"
          fi
          # --check-npm so an INTERRUPTED release can resume. Versions can sit bumped-but-unpublished
          # on main; without asking the registry, no later push would ever set publish=true again.
          node tooling/classify-change.mjs --before "$BEFORE" --after "$CURRENT_SHA" --check-npm

  # Repository code and dependencies are validated without write or OIDC authority — by EXECUTING the
  # one command, browsers included, in the pinned Playwright container on the LAN Linux boxes. This
  # job used to run a hand-assembled subset on a mini and take the browser half on trust from a
  # receipt; `pnpm verify` is that same subset plus the browser suite, and it is the identical
  # command ci.yml and every developer run.
  #
  # No fork guard here: release.yml triggers on `push` to main only, so there is no fork-authored ref
  # for one to guard. verify-workflow-security.mjs requires the guard exactly on the jobs of a
  # workflow that has a `pull_request` trigger.
  quality-gate:
    needs: changes
    if: needs.changes.outputs.publish == 'true'
    runs-on: [self-hosted, linux, vsk-runner]
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
      volumes:
        - /opt/vsk-runner/pnpm-store:/pnpm-store
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      # The runner's work directory is owned by the HOST runner user; inside the container the job
      # runs as root, so every `git` call refuses the repository with "detected dubious ownership"
      # (observed in run 34275909973: `tooling/secret-scan.mjs` shells out to `git ls-files` and died
      # with exit 128 mid-`pnpm lint`). This is git's uid check, not a permissions problem, and it hits
      # every tool in the chain that reads git — the secret scan, workspace-clean's tracked-path
      # refusal, and the registry integrity test's restore proof.
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Enable corepack
        run: |
          set -euo pipefail
          corepack enable
      - run: pnpm install --frozen-lockfile --store-dir /pnpm-store
      - run: pnpm verify

  # A changeset-bearing, reviewed main commit creates or updates the Version Packages PR. This job
  # has write authority for that PR but cannot mint npm OIDC. Merging the reviewed Version PR is the
  # separate human action that authorizes publication on the next main run.
  version-pr:
    needs: [changes, quality-gate]
    if: >-
      needs.changes.outputs.has_changesets == 'true' &&
      needs.quality-gate.result == 'success'
    runs-on: [self-hosted, vsk-runners-mac-mini]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run version-packages
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishing is the only release job with npm OIDC authority. It is reachable only after a reviewed
  # Version Packages PR has removed the pending changesets. The trusted-publisher identity is
  # repository + release.yml, matching the proven publish path.
  #
  # AUTH: npm OIDC TRUSTED PUBLISHING, token-free — and it works on self-hosted runners (sibling repo
  # vegastack/vegafactory publishes the same way). Only the provenance BUNDLE requires a GitHub-hosted
  # runner — npm rejects a self-hosted one with E422 — so the publish step passes the explicit
  # `--no-provenance` flag (the NPM_CONFIG_PROVENANCE env is not honoured by the changesets action's
  # OIDC path). Releases ship without an attestation while hosted runners are billing-locked.
  #
  # It builds the two PUBLIC packages in-job and publishes them directly. A separate build job handing
  # the dist over as an artifact was removed: with token-free OIDC there is no long-lived credential to
  # isolate from the build, and Actions artifact storage is unavailable under the billing lock, so the
  # cross-job upload/download failed. The `Reject publish-time lifecycle code` guard below still ensures
  # no package lifecycle script runs during `changeset publish`.
  publish:
    needs: [changes, quality-gate]
    if: >-
      needs.changes.outputs.publish == 'true' &&
      needs.changes.outputs.has_changesets == 'false' &&
      needs.quality-gate.result == 'success'
    runs-on: [self-hosted, vsk-runners-mac-mini]
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Pin npm to the reviewed OIDC-capable release
        # npm >= 11.5.1 speaks OIDC trusted publishing; this is the reviewed pin.
        run: npm install -g npm@11.16.0
      - run: pnpm install --frozen-lockfile
      # Build ONLY the two PUBLIC packages. `@vegastack/ui` is private by the locked distribution model
      # and must never be published.
      - run: pnpm --filter @vegastack/design-tokens build
      - run: pnpm --filter @vegastack/design build
      - run: node tooling/verify-package-exports.mjs
      - name: Reject publish-time lifecycle code
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const lifecycle = ['prepublish', 'prepare', 'prepublishOnly', 'prepack', 'postpack', 'publish', 'postpublish', 'preinstall', 'install', 'postinstall'];
          for (const directory of ['design', 'design-tokens']) {
            const pkg = JSON.parse(readFileSync(`packages/${directory}/package.json`, 'utf8'));
            for (const name of lifecycle) {
              if (pkg.scripts?.[name]) throw new Error(`${pkg.name} must not execute ${name} with npm OIDC authority`);
            }
          }
          NODE
      # Publish token-free via npm OIDC trusted publishing, with the explicit --no-provenance FLAG.
      # npm auto-detects OIDC (the id-token permission is granted, npm >= 11.5.1) and authenticates against the
      # package's trusted-publisher entry. Provenance MUST be off: npm can only verify a provenance
      # bundle from a GitHub-hosted runner and rejects a self-hosted one (E422). The NPM_CONFIG_PROVENANCE
      # env is NOT honoured by the changesets action's OIDC path, so we publish each package directly with
      # the flag — exactly as sibling repo vegastack/vegafactory does. Idempotent: a re-run over an
      # already-published version is a no-op, so a partial failure can be retried safely. design-tokens is
      # published before design (design may resolve it at install time).
      - name: Publish public packages to npm (trusted publishing, --no-provenance)
        run: |
          set -euo pipefail
          for dir in design-tokens design; do
            cd "$GITHUB_WORKSPACE/packages/$dir"
            NAME=$(node -p "require('./package.json').name")
            VERSION=$(node -p "require('./package.json').version")
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$NAME@$VERSION is already on the registry; skipping."
            else
              echo "Publishing $NAME@$VERSION"
              npm publish --access public --no-provenance
            fi
          done
