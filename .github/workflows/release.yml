name: Release
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  SITE_VISIBILITY: public

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      visual: ${{ steps.detect.outputs.visual }}
      publish: ${{ steps.detect.outputs.publish }}
      has_changesets: ${{ steps.detect.outputs.has_changesets }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BEFORE="$BEFORE_SHA"
          if ! git rev-parse --verify -q "$BEFORE" >/dev/null 2>&1 || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="${CURRENT_SHA}~1"
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "$CURRENT_SHA")
          printf 'changed files:\n%s\n' "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(packages/ui/registry/|packages/ui/src/|packages/design/|packages/design-tokens/|apps/docs/components/|apps/docs/app/|apps/docs/lib/|apps/docs/vrt/components\.spec\.ts|pnpm-lock\.yaml|apps/docs/package\.json)'; then
            echo "visual=true" >> "$GITHUB_OUTPUT"
          else
            echo "visual=false" >> "$GITHUB_OUTPUT"
          fi
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' -print -quit | grep -q .; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
            if echo "$CHANGED" | grep -qE '^packages/'; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  vrt-gate:
    needs: changes
    if: needs.changes.outputs.visual == 'true'
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.0-noble@sha256:57b65fdc9ceabe0ef613124c7bbe2babcf9362c4d85e382fe3b03604e84b428a
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Require complete Linux VRT baselines
        run: pnpm --filter @vegastack/docs verify:vrt-baselines
      - name: VRT pixel gate
        working-directory: apps/docs
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: vrt-report.json
        run: pnpm exec playwright test --reporter=list,json
      - name: Guard — fail if zero screenshot tests executed
        working-directory: apps/docs
        run: |
          node -e '
            const r = require("./vrt-report.json");
            const ran = (r.stats?.expected||0)+(r.stats?.unexpected||0)+(r.stats?.flaky||0);
            if (ran === 0) { console.error("✗ VRT executed 0 screenshot tests — not valid passing evidence."); process.exit(1); }
          '

  # Repository code and dependencies are validated without write or OIDC authority.
  quality-gate:
    needs: [changes, vrt-gate]
    if: >-
      always() && needs.changes.outputs.publish == 'true' &&
      (needs.vrt-gate.result == 'success' ||
       (needs.vrt-gate.result == 'skipped' && needs.changes.outputs.visual == 'false'))
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.0-noble@sha256:57b65fdc9ceabe0ef613124c7bbe2babcf9362c4d85e382fe3b03604e84b428a
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm }
      - name: Mark workspace safe for git (container ownership)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @vegastack/ui test:all-browsers
        # Firefox requires HOME to be owned by the current container user (root).
        env:
          HOME: /root
      - run: pnpm build
      - run: pnpm registry:build
      - name: Require registry build idempotency
        run: |
          set -euo pipefail
          git status --porcelain > "$RUNNER_TEMP/git-status"
          if [ -s "$RUNNER_TEMP/git-status" ]; then
            echo "::error title=Generated registry drift::registry:build changed the checked-out release commit."
            cat "$RUNNER_TEMP/git-status"
            exit 1
          fi
      - run: pnpm registry:verify-consume
      - name: Upload validated public-package build outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package-dist-${{ github.sha }}
          path: |
            packages/design/dist
            packages/design-tokens/dist
          if-no-files-found: error
          retention-days: 1

  # A changeset-bearing, reviewed main commit creates or updates the Version Packages PR. This job
  # has write authority for that PR but cannot mint npm OIDC. Merging the reviewed Version PR is
  # the separate human action that authorizes publication on the next main run.
  version-pr:
    needs: [changes, quality-gate]
    if: >-
      needs.changes.outputs.has_changesets == 'true' &&
      needs.quality-gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run version-packages
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishing is isolated from validation and is the only release job with npm OIDC authority.
  # It is reachable only after a reviewed Version Packages PR has removed the pending changesets.
  # The trusted-publisher identity is repository + release.yml, matching the proven 0.1.1 path.
  publish:
    needs: [changes, quality-gate]
    if: >-
      needs.changes.outputs.has_changesets == 'false' &&
      needs.quality-gate.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Pin npm to the reviewed OIDC-capable release
        run: npm install -g npm@11.16.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: npm-package-dist-${{ github.sha }}
          path: packages
      - name: Reject publish-time lifecycle code
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const lifecycle = ['prepublish', 'prepare', 'prepublishOnly', 'prepack', 'postpack', 'publish', 'postpublish', 'preinstall', 'install', 'postinstall'];
          for (const directory of ['design', 'design-tokens']) {
            const pkg = JSON.parse(readFileSync(`packages/${directory}/package.json`, 'utf8'));
            for (const name of lifecycle) {
              if (pkg.scripts?.[name]) throw new Error(`${pkg.name} must not execute ${name} with npm OIDC authority`);
            }
          }
          NODE
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm changeset publish
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
