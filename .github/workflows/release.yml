name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit to resume
        required: true
        type: string

permissions:
  contents: read

env:
  SITE_VISIBILITY: public

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  changes:
    name: Inspect release state
    runs-on: [self-hosted, vsk-runners-mac-mini]
    timeout-minutes: 10
    outputs:
      target_sha: ${{ steps.detect.outputs.target_sha }}
      publish: ${{ steps.detect.outputs.publish }}
      has_changesets: ${{ steps.detect.outputs.has_changesets }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24 }
      - id: detect
        name: Bind to main and classify the release
        env:
          REQUESTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$REQUESTED_SHA" || {
            echo "::error title=Stale release run::main moved after $REQUESTED_SHA"
            exit 1
          }
          node tooling/release-detect.mjs \
            --before "${REQUESTED_SHA}~1" \
            --after "$REQUESTED_SHA" \
            --check-npm
          echo "target_sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"

  version-pr:
    name: Create or update Version Packages PR
    needs: changes
    if: needs.changes.outputs.has_changesets == 'true'
    runs-on: [self-hosted, vsk-runners-mac-mini]
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    outputs:
      base_sha: ${{ needs.changes.outputs.target_sha }}
      head_sha: ${{ steps.version-pr.outputs.head_sha }}
      pr_number: ${{ steps.version-pr.outputs.pr_number }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.changes.outputs.target_sha }}
      - name: Give Changesets its base branch
        env:
          TARGET_SHA: ${{ needs.changes.outputs.target_sha }}
        run: git branch -f main "$TARGET_SHA"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24 }
      - run: pnpm install --frozen-lockfile --ignore-scripts --store-dir "$RUNNER_WORKSPACE/pnpm-store"
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run version-packages
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: version-pr
        name: Resolve the exact generated PR head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ needs.changes.outputs.target_sha }}
          VERSION_BRANCH: changeset-release/main
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            PR_NUMBER=$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$VERSION_BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty')
            [ -n "$PR_NUMBER" ] && break
            test "$attempt" -lt 3 || {
              echo "::error::Changesets did not leave an open Version Packages PR"
              exit 1
            }
            sleep $((attempt * 2))
          done
          HEAD_SHA=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          test -n "$HEAD_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$VERSION_BRANCH" --jq .object.sha)" = "$HEAD_SHA"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Version Packages PR #$PR_NUMBER: $TARGET_SHA..$HEAD_SHA"

  publish:
    name: Publish public packages
    needs: changes
    if: >-
      needs.changes.outputs.publish == 'true' &&
      needs.changes.outputs.has_changesets == 'false'
    runs-on: [self-hosted, vsk-runners-mac-mini]
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.changes.outputs.target_sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Pin npm to the reviewed OIDC-capable release
        run: npm install -g npm@11.16.0
      - run: pnpm install --frozen-lockfile --ignore-scripts --store-dir "$RUNNER_WORKSPACE/pnpm-store"
      - run: pnpm --filter @vegastack/design-tokens build
      - run: pnpm --filter @vegastack/design build
      - run: node tooling/verify-package-exports.mjs
      - name: Reject publish-time lifecycle code
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const lifecycle = ['prepublish', 'prepare', 'prepublishOnly', 'prepack', 'postpack', 'publish', 'postpublish', 'preinstall', 'install', 'postinstall'];
          for (const directory of ['design', 'design-tokens']) {
            const pkg = JSON.parse(readFileSync(`packages/${directory}/package.json`, 'utf8'));
            for (const name of lifecycle) {
              if (pkg.scripts?.[name]) throw new Error(`${pkg.name} must not execute ${name} with npm OIDC authority`);
            }
          }
          NODE
      - name: Publish missing versions with three bounded attempts
        run: |
          set -euo pipefail
          for dir in design-tokens design; do
            cd "$GITHUB_WORKSPACE/packages/$dir"
            NAME=$(node -p "require('./package.json').name")
            VERSION=$(node -p "require('./package.json').version")
            for attempt in 1 2 3; do
              if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
                echo "$NAME@$VERSION is already published"
                break
              fi
              if npm publish --access public --no-provenance; then
                break
              fi
              if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
                echo "$NAME@$VERSION became visible after the publish response failed"
                break
              fi
              test "$attempt" -lt 3 || exit 1
              sleep $((attempt * 10))
            done
          done

  dispatch-deploy:
    name: Dispatch public distribution deploy
    needs: [changes, publish]
    runs-on: [self-hosted, vsk-runners-mac-mini]
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch the exact release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.changes.outputs.target_sha }}
        run: |
          set -euo pipefail
          BEFORE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --limit 20 --json databaseId --jq '.[].databaseId')
          for attempt in 1 2 3; do
            if gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f expected_sha="$RELEASE_SHA"; then
              exit 0
            fi
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$RELEASE_SHA\") | .databaseId" | head -1)
            if [ -n "$RUN_ID" ] && ! grep -qx "$RUN_ID" <<<"$BEFORE"; then
              echo "deploy run $RUN_ID exists despite the dispatch error"
              exit 0
            fi
            test "$attempt" -lt 3 || exit 1
            sleep $((attempt * 10))
          done
